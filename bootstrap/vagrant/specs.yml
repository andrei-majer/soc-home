# bootstrap/vagrant/specs.yml
# Per-VM resource specs. Hostnames MUST match ansible/inventory/hosts.yml.
#
# TODO BEFORE FIRST REAL DEPLOY: replace the ram/cpu/disk values below with
# the actual .15 VM allocations. The current values are reasonable estimates
# from the design doc; they have not been confirmed against the live VMs.
#
# To capture actuals, run on .15:
#   foreach ($vm in 'Suricata','ELK','OpenCTi','T-Pot Hive','T-Pot Sensor','OpenCanary') {
#     & 'C:\Program Files\Oracle\VirtualBox\VBoxManage.exe' showvminfo $vm --machinereadable |
#       Select-String -Pattern '^(memory|cpus)=' | ForEach-Object { "[$vm] $_" }
#   }

suricata-20:
  ip: 192.168.1.20
  ram: 8192        # MB
  cpu: 4
  disk: 60         # GB (Vagrant attaches second disk if >20)
  monitoring_nic: true   # Adds second adapter, promiscuous "Allow All" for SPAN/IDS

elk-21:
  ip: 192.168.1.21
  ram: 16384
  cpu: 4
  disk: 80
  monitoring_nic: false

opencti-22:
  ip: 192.168.1.22
  ram: 8192
  cpu: 4
  disk: 60
  monitoring_nic: false

tpot-hive-23:
  ip: 192.168.1.23
  ram: 12288
  cpu: 4
  disk: 100
  monitoring_nic: false

fileserver-24:
  ip: 192.168.1.24
  ram: 2048
  cpu: 2
  disk: 20
  monitoring_nic: false

# Retired 2026-06-07, re-activated 2026-07-31 on the renumbered .25 (was .125).
# RAM raised 4096 -> 8192 after the sensor OOM-looped its logstash heap.
tpot-sensor-25:
  ip: 192.168.1.25
  ram: 8192
  cpu: 2
  disk: 60
  monitoring_nic: false
