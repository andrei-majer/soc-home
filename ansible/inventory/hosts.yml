all:
  children:
    debian:
      hosts:
        suricata-120:
          ansible_host: 192.168.1.120
          ansible_connection: local
        elk-133:
          ansible_host: 192.168.1.133
        opencti-135:
          ansible_host: 192.168.1.135
        fileserver-140:
          ansible_host: 192.168.1.140
    canary:
      hosts:
        fileserver-140:
    tpot:
      hosts:
        tpot-hive-130:
          ansible_host: 192.168.1.130
          ansible_port: 64295
          tpot_type: HIVE
        # tpot-sensor-125:  # disabled 2026-06-07 — VM kept off, HIVE covers honeypots
        #   ansible_host: 192.168.1.125
        #   ansible_port: 64295
        #   tpot_type: SENSOR
    openwrt:
      hosts:
        router-1:
          ansible_host: 192.168.1.1
          ansible_user: root
          ansible_connection: ssh
          ansible_shell_type: sh
          ansible_python_interpreter: /bin/false
    windows:
      hosts:
        hypervisor-15:
          ansible_host: 192.168.1.15
          ansible_user: Games
          ansible_ssh_pass: "{{ vault_hypervisor_15_ssh_pass }}"
          ansible_connection: ssh
          ansible_shell_type: cmd
          ansible_python_interpreter: /bin/false
