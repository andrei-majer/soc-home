ansible_user: root
ansible_ssh_private_key_file: ~/.ssh/id_ed25519

home_net:
  - "192.168.1.0/24"
  - "10.0.0.0/24"
  - "100.64.0.0/10"
home_net_ipv6:
  - "fd7a:115c:a1e0::/48"
  - "fe80::/10"

dns_server: 192.168.1.1
ntp_timezone: Europe/Bucharest

suricata_host: 192.168.1.20
elk_host: 192.168.1.21
opencti_host: 192.168.1.22
misp_host: 192.168.1.21
router_host: 192.168.1.1

ntfy_host: 192.168.1.20
ntfy_port: 8090
ntfy_base_url: "http://{{ ntfy_host }}:{{ ntfy_port }}"

# ---------- Telegram alerting (migrating off ntfy 2026-06-29) ----------
# Secrets in group_vars/all/vault.yml (vault_telegram_*). chat_id is also a
# secret here so neither token nor chat leak to the public soc-home mirror.
telegram_bot_token: "{{ vault_telegram_bot_token }}"
telegram_chat_id: "{{ vault_telegram_chat_id }}"
telegram_api_url: "https://api.telegram.org/bot{{ telegram_bot_token }}"

backup_dir: /opt/soc-ansible/backups

ntp_server: "{{ router_host }}"
