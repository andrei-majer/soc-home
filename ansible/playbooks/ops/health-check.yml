---
- name: Pre-flight — hypervisor .15 reachable
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Ping hypervisor .15
      ansible.builtin.command: ping -c1 -W2 192.168.1.15
      register: hv_ping
      changed_when: false
      failed_when: false
    - name: Probe OpenCTI .22 SSH reachability (distinguishes running vs saved/off)
      ansible.builtin.wait_for:
        host: 192.168.1.22
        port: 22
        timeout: 3
        state: started
      register: opencti_probe
      failed_when: false
      changed_when: false
      when: hv_ping.rc == 0
    - name: Set opencti_vm_state fact
      ansible.builtin.set_fact:
        opencti_vm_state: "{{ 'running' if (opencti_probe.state | default('') == 'started') else 'saved' }}"
      when: hv_ping.rc == 0
    - name: Abort early if hypervisor .15 is down
      ansible.builtin.fail:
        msg: >-
          Hypervisor .15 is DOWN — every SOC VM (.20/.21/.23; .22 on-demand) is
          unreachable until it is back up. Recover: WoL .15 from .13 (magic packet
          to MAC B4:2E:99:34:9C:6B), wait ~2-3 min for the VMs to cold-boot, then
          re-run this health check.
      when: hv_ping.rc != 0

- name: Health check — Suricata host (.20)
  hosts: suricata-20
  gather_facts: true
  tasks:
    - name: Check systemd services (.20)  # noqa: command-instead-of-module
      ansible.builtin.command: "systemctl is-active {{ item }}"
      loop: [suricata, snort3, fail2ban, filebeat, loki, promtail, grafana-server, evebox, velociraptor]
      register: svc_20
      failed_when: false
      changed_when: false
    - name: Disk pct (.20)
      ansible.builtin.shell: df / | awk 'NR==2{print $5}' | tr -d '%'
      register: disk_pct_20
      failed_when: false
      changed_when: false
    - name: Disk detail (.20)
      ansible.builtin.command: df -h /
      register: disk_20
      failed_when: false
      changed_when: false
    - name: Suricata rule count (.20)
      ansible.builtin.shell: |
        suricatasc -c dump-counters 2>/dev/null | python3 -c "
        import sys,json; d=json.load(sys.stdin)
        print(d.get('message',{}).get('detect',{}).get('engines',[{}])[0].get('rules_loaded','n/a'))
        " 2>/dev/null || grep -oP 'rules loaded: \K[0-9]+' /var/log/suricata/suricata.log | tail -1 || echo n/a
      args:
        executable: /bin/bash
      register: rules_20
      failed_when: false
      changed_when: false
    - name: EVE log freshness in seconds (.20)
      ansible.builtin.shell: |
        last=$(stat -c %Y /var/log/suricata/eve.json 2>/dev/null) || { echo -1; exit 0; }
        echo "$(( $(date +%s) - last ))"
      args:
        executable: /bin/bash
      register: eve_age_20
      failed_when: false
      changed_when: false
    - name: MISP IOC rules file age in seconds (.20)
      ansible.builtin.shell: |
        f=/etc/suricata/rules/misp.rules
        [ -f "$f" ] && echo $(( $(date +%s) - $(stat -c %Y "$f") )) || echo -1
      args:
        executable: /bin/bash
      register: misp_rules_age_20
      failed_when: false
      changed_when: false
    - name: MISP IOC rules line count (.20)
      ansible.builtin.shell: wc -l < /etc/suricata/rules/misp.rules 2>/dev/null || echo 0
      args:
        executable: /bin/bash
      register: misp_rules_count_20
      failed_when: false
      changed_when: false
    - name: Zeek node status (.20)
      ansible.builtin.command: /opt/zeek/bin/zeekctl status
      register: zeek_status_20
      failed_when: false
      changed_when: false
    - name: Zeek conn.log freshness in seconds (.20)
      ansible.builtin.shell: |
        f=/opt/zeek/logs/current/conn.log
        [ -f "$f" ] && echo "$(( $(date +%s) - $(stat -c %Y "$f") ))" || echo -1
      args:
        executable: /bin/bash
      register: zeek_conn_age_20
      failed_when: false
      changed_when: false

- name: Health check — ELK host (.21)
  hosts: elk-21
  gather_facts: true
  tasks:
    - name: Check systemd services (.21)  # noqa: command-instead-of-module
      ansible.builtin.command: "systemctl is-active {{ item }}"
      loop: [elasticsearch, kibana, logstash, filebeat, wazuh-manager, wazuh-dashboard, apache2, mariadb, misp-workers]
      register: svc_21
      failed_when: false
      changed_when: false
    - name: Elasticsearch cluster health (.21)
      ansible.builtin.uri:
        url: http://localhost:9200/_cluster/health
        return_content: true
      register: es_health_21
      failed_when: false
    - name: Wazuh agent count (.21)
      ansible.builtin.shell: wc -l < /var/ossec/etc/client.keys 2>/dev/null || echo 0
      args:
        executable: /bin/bash
      register: wazuh_agents_21
      failed_when: false
      changed_when: false
    - name: Wazuh API port (.21)
      ansible.builtin.uri:
        url: https://localhost:55000/
        validate_certs: false
        status_code: [200, 401]
      register: wazuh_api_21
      failed_when: false
    - name: MISP enabled feeds count (.21)
      ansible.builtin.shell: mysql misp -Nse "SELECT COUNT(*) FROM feeds WHERE enabled=1" 2>/dev/null || echo -1
      args:
        executable: /bin/bash
      register: misp_feeds_21
      failed_when: false
      changed_when: false
    - name: Disk pct (.21)
      ansible.builtin.shell: df / | awk 'NR==2{print $5}' | tr -d '%'
      register: disk_pct_21
      failed_when: false
      changed_when: false
    - name: Disk detail (.21)
      ansible.builtin.command: df -h /
      register: disk_21
      failed_when: false
      changed_when: false

    # ---------- Auto-remediation for wazuh-manager (opt-in via -e auto_remediate=true) ----------
    # Safety: only fires when wazuh-manager is failed AND the box is otherwise healthy
    # (ES API reachable, mem available, disk < 90%). A broader incident keeps this dormant.
    - name: Auto-remediate wazuh-manager if failed (opt-in)
      when:
        - auto_remediate | default(false) | bool
        - (svc_21.results | selectattr('item', 'equalto', 'wazuh-manager') | map(attribute='stdout') | first | trim) == 'failed'
        - (disk_pct_21.stdout | default(99) | int) < 90
        - (es_health_21.status | default(0)) == 200
        - (ansible_memfree_mb | default(0) | int) > 1024
      block:
        - name: "[remediate] Stop wazuh-manager cleanly"
          ansible.builtin.systemd:
            name: wazuh-manager
            state: stopped
        - name: "[remediate] Kill any zombie wazuh-apid bound to :55000"
          ansible.builtin.shell: |
            set -e
            pid=$(ss -tlnpH 'sport = :55000' 2>/dev/null | awk -F'pid=' '/python3/ {split($2,a,","); print a[1]}' | head -1)
            if [ -n "$pid" ]; then
              echo "killing zombie wazuh-apid pid=$pid"
              kill -9 "$pid" 2>/dev/null || true
              sleep 2
            else
              echo "no zombie apid"
            fi
          args:
            executable: /bin/bash
          register: kill_zombie
          changed_when: "'killing' in kill_zombie.stdout"
        - name: "[remediate] Wait for :55000 to fully release"
          ansible.builtin.wait_for:
            port: 55000
            state: stopped
            timeout: 30
          failed_when: false
        - name: "[remediate] Clear stale pidfiles and apid .failed marker"
          ansible.builtin.shell: |
            rm -f /var/ossec/var/run/*.pid /var/ossec/var/run/wazuh-apid.failed
          args:
            executable: /bin/bash
          changed_when: true
        - name: "[remediate] Reset systemd failed state"
          ansible.builtin.command: systemctl reset-failed wazuh-manager
          changed_when: true
        - name: "[remediate] Start wazuh-manager"
          ansible.builtin.systemd:
            name: wazuh-manager
            state: started
        - name: "[remediate] Wait for API on :55000 (max 60s)"
          ansible.builtin.wait_for:
            port: 55000
            timeout: 60
        - name: "[remediate] Verify API responds (up to 6 retries × 5s)"
          ansible.builtin.uri:
            url: https://localhost:55000/
            validate_certs: false
            status_code: [200, 401]
          register: post_remediate_api
          retries: 6
          delay: 5
          until: post_remediate_api.status in [200, 401]
        - name: "[remediate] Refresh wazuh-manager status for summary"  # noqa: command-instead-of-module
          ansible.builtin.command: systemctl is-active wazuh-manager
          register: wazuh_post_remediate
          failed_when: false
          changed_when: false
        - name: "[remediate] Report"
          ansible.builtin.debug:
            msg: >-
              wazuh-manager auto-remediated — service={{ wazuh_post_remediate.stdout | trim }},
              api status={{ post_remediate_api.status }}

- name: Health check — OpenCTI host (.22)
  vars:
    opencti_vm_state: "{{ hostvars['localhost']['opencti_vm_state'] | default('unknown') }}"
  any_errors_fatal: false
  ignore_unreachable: true
  hosts: opencti-22
  gather_facts: true
  tasks:
    - name: Check opencti systemd service  # noqa: command-instead-of-module
      ansible.builtin.command: systemctl is-active opencti
      register: svc_22
      failed_when: false
      changed_when: false
    - name: OpenCTI docker container count (.22)
      ansible.builtin.shell: docker compose -f /opt/opencti/docker-compose.yml ps -q 2>/dev/null | wc -l
      args:
        executable: /bin/bash
      register: docker_22
      failed_when: false
      changed_when: false
    - name: OpenCTI core restart count + uptime + status (.22)
      ansible.builtin.shell: |
        rc=$(docker inspect opencti-opencti-1 -f '{% raw %}{{.RestartCount}}{% endraw %}' 2>/dev/null || echo -1)
        st=$(docker inspect opencti-opencti-1 -f '{% raw %}{{.State.Status}}{% endraw %}' 2>/dev/null || echo unknown)
        start=$(docker inspect opencti-opencti-1 -f '{% raw %}{{.State.StartedAt}}{% endraw %}' 2>/dev/null || echo "")
        if [ -n "$start" ]; then
          secs=$(( $(date +%s) - $(date -d "$start" +%s) ))
          up_h=$(( secs / 3600 )); up_m=$(( secs / 60 ))
        else
          up_h=-1; up_m=-1
        fi
        echo "$rc $up_h $up_m $st"
      args:
        executable: /bin/bash
      register: opencti_core_22
      failed_when: false
      changed_when: false
    - name: Disk pct (.22)
      ansible.builtin.shell: df / | awk 'NR==2{print $5}' | tr -d '%'
      register: disk_pct_22
      failed_when: false
      changed_when: false
    - name: Disk detail (.22)
      ansible.builtin.command: df -h /
      register: disk_22
      failed_when: false
      changed_when: false
    # Connector freshness (added 2026-07-30) — catches the "connectors stuck in
    # Python retry loop after cold-boot" pathology where containers are Up but
    # the pycti retry never recovers (see soc-lab/opencti-22.md). Emits
    # `<max_stale_secs> <stale_names_csv>` where max_stale_secs = seconds since
    # newest heartbeat of ANY active TI connector (excludes internal
    # `[TASK]`/`[FILE]`/`[DRAFT]` connectors, which have null updated_at).
    # Heartbeat interval is ~30s; >5min stale = definitely broken.
    - name: OpenCTI connector freshness (.22)
      ansible.builtin.shell: |
        token=$(grep '^OPENCTI_ADMIN_TOKEN=' /opt/opencti/.env | cut -d= -f2)
        [ -z "$token" ] && { echo "-1 no-token"; exit 0; }
        resp=$(curl -sS --max-time 10 -X POST http://localhost:8080/graphql \
          -H "Authorization: Bearer $token" \
          -H "Content-Type: application/json" \
          -d '{"query":"{ connectors { name active updated_at } }"}' 2>/dev/null) || { echo "-1 curl-fail"; exit 0; }
        echo "$resp" | jq -r --arg now "$(date -u +%s)" '
          [.data.connectors[]
            | select(.active==true and (.name | startswith("[") | not) and .updated_at)
            | {name, age: (($now|tonumber) - (.updated_at | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601))}]
          | if length == 0 then "-1 no-connectors"
            else "\(max_by(.age).age) \([.[] | select(.age > 300) | .name] | join(","))"
            end' 2>/dev/null || echo "-1 parse-fail"
      args:
        executable: /bin/bash
      register: opencti_conn_freshness_22
      failed_when: false
      changed_when: false

- name: Health check — T-Pot host (.23)
  hosts: tpot
  gather_facts: true
  tasks:
    - name: T-Pot systemd services state  # noqa: command-instead-of-module
      ansible.builtin.command: "systemctl is-active {{ item }}"
      loop: [tpot, wazuh-agent]
      register: svc_tpot
      failed_when: false
      changed_when: false
    - name: T-Pot docker container count
      ansible.builtin.shell: docker ps -q | wc -l
      args:
        executable: /bin/bash
      register: docker_tpot
      failed_when: false
      changed_when: false
    - name: Disk pct (T-Pot)
      ansible.builtin.shell: df / | awk 'NR==2{print $5}' | tr -d '%'
      register: disk_pct_tpot
      failed_when: false
      changed_when: false
    - name: Disk detail (T-Pot)
      ansible.builtin.command: df -h /
      register: disk_tpot
      failed_when: false
      changed_when: false

- name: Health check — canary (.24 fs1)
  hosts: canary
  gather_facts: true
  tasks:
    - name: Check systemd services (.24)  # noqa: command-instead-of-module
      ansible.builtin.command: "systemctl is-active {{ item }}"
      loop: [opencanary, sinkhole, wazuh-agent, smbd]
      register: svc_24
      failed_when: false
      changed_when: false
    - name: Canary listening port count (.24)
      ansible.builtin.shell: ss -tln | grep -v ':22 ' | grep -c LISTEN
      args:
        executable: /bin/bash
      register: ports_24
      failed_when: false
      changed_when: false
    - name: OpenCanary log stat (.24)
      ansible.builtin.stat:
        path: /var/tmp/opencanary.log
      register: ocan_log_24
    - name: Sinkhole log stat (.24)
      ansible.builtin.stat:
        path: /var/log/sinkhole.json
      register: sink_log_24
    - name: Disk pct (.24)
      ansible.builtin.shell: df / | awk 'NR==2{print $5}' | tr -d '%'
      register: disk_pct_24
      failed_when: false
      changed_when: false
    - name: Disk detail (.24)
      ansible.builtin.command: df -h /
      register: disk_24
      failed_when: false
      changed_when: false

- name: Health check — OpenWrt router
  hosts: openwrt
  gather_facts: false
  tasks:
    - name: Check uhttpd running
      ansible.builtin.raw: "pgrep uhttpd >/dev/null && echo running || echo stopped"
      register: uhttpd_state
      changed_when: false
    - name: Check AdGuardHome running
      ansible.builtin.raw: "pgrep AdGuardHome >/dev/null && echo running || echo stopped"
      register: adguard_state
      changed_when: false
    - name: Router disk pct
      ansible.builtin.raw: "df / | awk 'NR==2{print $5}' | tr -d %"
      register: disk_pct_router
      changed_when: false
    - name: Router uptime
      ansible.builtin.raw: uptime
      register: router_uptime
      changed_when: false

- name: Health check — hypervisor .15
  hosts: hypervisor-15
  gather_facts: false
  tasks:
    - name: List running VMs (.15)  # noqa: command-instead-of-module
      ansible.builtin.command: VBoxManage list runningvms
      register: vms_15
      changed_when: false
    - name: OpenCTi actual VBox VMState (.15)  # noqa: command-instead-of-module
      # Distinguishes a legitimate on-demand savestate/poweroff from 'aborted' (crashed
      # mid-run or mid-savestate) — the OpenCTI play below only sees SSH reachability, which
      # can't tell 'saved' from 'aborted' since both are unreachable. Found 2026-07-11: VM sat
      # in 'aborted' for 8 days undetected. See soc-lab/opencti-22.md "Aborted-state gap".
      ansible.builtin.shell: |
        VBoxManage showvminfo OpenCTi --machinereadable 2>/dev/null | grep -oP '^VMState="\K[^"]+' || echo unknown
      args:
        executable: /bin/bash
      register: opencti_vbox_state_15
      changed_when: false
    - name: VM storage free GB (/mnt/vms on .15)
      ansible.builtin.shell: |
        df --output=avail /mnt/vms | tail -1 | awk '{printf "%.1f\n", $1/1024/1024}'
      register: disk_15
      changed_when: false
    - name: Encrypted backup free GB (/mnt/backup on .15)
      ansible.builtin.shell: |
        df --output=avail /mnt/backup | tail -1 | awk '{printf "%.1f\n", $1/1024/1024}'
      register: disk_15_backup
      changed_when: false

- name: Print health summary and fail on issues
  hosts: suricata-20
  gather_facts: false
  vars:
    opencti_vm_state: "{{ hostvars['localhost']['opencti_vm_state'] | default('unknown') }}"
    expected_vms: ['Suricata', 'ELK', 'T-Pot Hive', 'OpenCanary']
  tasks:
    - name: Summary table
      ansible.builtin.debug:
        msg: |
          ================= SOC LAB HEALTH SUMMARY =================
          --- .20 suricata services ---
          {% for r in hostvars['suricata-20']['svc_20']['results'] %}
          {{ '[OK]  ' if r.stdout == 'active' else '[FAIL]' }} {{ '%-20s' | format(r.item) }} {{ r.stdout | default('?') }}
          {% endfor %}
          rules loaded : {{ hostvars['suricata-20']['rules_20']['stdout'] | default('n/a') | trim }}
          {% set eve_secs = hostvars['suricata-20']['eve_age_20']['stdout'] | default('-1') | trim | int %}
          eve.json     : {{ 'missing [FAIL]' if eve_secs < 0 else (eve_secs ~ 's ago' ~ (' [FAIL]' if eve_secs > 300 else (' [WARN]' if eve_secs > 60 else ''))) }}
          {% set zk_secs = hostvars['suricata-20']['zeek_conn_age_20']['stdout'] | default('-1') | trim | int %}
          Zeek         : {{ '[OK]   running' if 'running' in (hostvars['suricata-20']['zeek_status_20']['stdout'] | default('')) else '[FAIL] not running' }}, conn.log {{ 'missing [FAIL]' if zk_secs < 0 else (zk_secs ~ 's ago' ~ (' [FAIL]' if zk_secs > 300 else (' [WARN]' if zk_secs > 60 else ''))) }}
          MISP rules   : {{ hostvars['suricata-20']['misp_rules_count_20']['stdout'] | default('?') | trim }} rules, {{ (hostvars['suricata-20']['misp_rules_age_20']['stdout'] | default('-1') | trim | int) // 3600 }}h old{{ ' [FAIL] file missing' if (hostvars['suricata-20']['misp_rules_age_20']['stdout'] | default('-1') | trim | int) < 0 else (' [WARN]' if (hostvars['suricata-20']['misp_rules_age_20']['stdout'] | default('0') | trim | int) > 28800 else '') }}
          disk         : {{ hostvars['suricata-20']['disk_pct_20']['stdout'] | default('?') | trim }}%{{ ' [WARN]' if (hostvars['suricata-20']['disk_pct_20']['stdout'] | default('0') | trim | int) >= 80 else '' }}
          {{ hostvars['suricata-20']['disk_20']['stdout'] | default('n/a') }}

          --- .21 elk services ---
          {% for r in hostvars['elk-21']['svc_21']['results'] | default([]) %}
          {{ '[OK]  ' if r.stdout == 'active' else '[FAIL]' }} {{ '%-20s' | format(r.item) }} {{ r.stdout | default('?') }}
          {% endfor %}
          ES health    : {{ hostvars['elk-21']['es_health_21']['json']['status'] | default('n/a') }}{{ ' [WARN]' if hostvars['elk-21']['es_health_21']['json']['status'] | default('') not in ['green','yellow'] else '' }}
          Wazuh agents : {{ hostvars['elk-21']['wazuh_agents_21']['stdout'] | default('n/a') | trim }}
          Wazuh API    : {{ '[OK]  ' if hostvars['elk-21']['wazuh_api_21']['status'] | default(-1) in [200, 401] else '[FAIL] port 55000 down' }}
          MISP feeds   : {{ hostvars['elk-21']['misp_feeds_21']['stdout'] | default('?') | trim }} enabled{{ ' [FAIL] expected 8' if (hostvars['elk-21']['misp_feeds_21']['stdout'] | default('-1') | trim | int) != 8 else '' }}
          disk         : {{ hostvars['elk-21']['disk_pct_21']['stdout'] | default('?') | trim }}%{{ ' [WARN]' if (hostvars['elk-21']['disk_pct_21']['stdout'] | default('0') | trim | int) >= 80 else '' }}
          {{ hostvars['elk-21']['disk_21']['stdout'] | default('n/a') }}

          --- .22 opencti ({{ opencti_vm_state | default('unknown') }}) ---
          {% if (opencti_vm_state | default('unknown')) == 'saved' %}
          [SAVED] OpenCTI VM is in on-demand savestate mode — wake with opencti-wake.ps1 (.13) if needed
          {% else %}
          {{ '[OK]  ' if (hostvars['opencti-22']['svc_22'] is defined and hostvars['opencti-22']['svc_22']['stdout'] == 'active') else '[FAIL]' }} opencti svc
          containers   : {{ hostvars['opencti-22']['docker_22']['stdout'] | default('n/a') | trim }}
          {% set octi = (hostvars['opencti-22']['opencti_core_22']['stdout'] | default('-1 -1 -1 unknown')).split() %}
          core restarts: {{ octi[0] }} (up {{ octi[1] }}h, {{ octi[3] }}){{ ' [WARN] restart loop?' if (octi[3] != 'running') or ((octi[0] | int) > 2 and (octi[2] | int) >= 0 and (octi[2] | int) < 10) else '' }}
          {% set conn_parts = (hostvars['opencti-22']['opencti_conn_freshness_22']['stdout'] | default('-1 unknown')).split(' ', 1) %}
          {% set conn_age = conn_parts[0] | int %}
          {% set conn_stale = conn_parts[1] | default('') | trim %}
          connectors   : {{ 'newest heartbeat ' ~ conn_age ~ 's ago' if conn_age >= 0 else 'unavailable (' ~ conn_stale ~ ')' }}{{ ' [FAIL] stuck: ' ~ conn_stale if conn_age > 300 and conn_stale not in ['', 'no-token', 'curl-fail', 'no-connectors', 'parse-fail'] else '' }}
          disk         : {{ hostvars['opencti-22']['disk_pct_22']['stdout'] | default('?') | trim }}%{{ ' [WARN]' if (hostvars['opencti-22']['disk_pct_22']['stdout'] | default('0') | trim | int) >= 80 else '' }}
          {{ hostvars['opencti-22']['disk_22']['stdout'] | default('n/a') }}
          {% endif %}

          --- T-Pot hosts ---
          {% for h in ['tpot-hive-23'] %}
          {% if hostvars[h]['svc_tpot'] is not defined %}
          [UNREACH] {{ h }}: facts not gathered (host unreachable)
          {% else %}
          {% set bad = hostvars[h]['svc_tpot']['results'] | selectattr('stdout', '!=', 'active') | list | length %}
          {{ '[OK]  ' if bad == 0 else '[FAIL]' }} {{ h }}: containers={{ hostvars[h]['docker_tpot']['stdout'] | default('n/a') | trim }} disk={{ hostvars[h]['disk_pct_tpot']['stdout'] | default('?') | trim }}%{{ ' [WARN]' if (hostvars[h]['disk_pct_tpot']['stdout'] | default('0') | trim | int) >= 80 else '' }}{% for r in hostvars[h]['svc_tpot']['results'] %}{% if r.stdout != 'active' %} [{{ r.item }}={{ r.stdout }}]{% endif %}{% endfor %}

          {% endif %}
          {% endfor %}

          --- .24 canary services ---
          {% if hostvars['fileserver-24']['svc_24'] is defined %}
          {% for r in hostvars['fileserver-24']['svc_24']['results'] %}
          {{ '[OK]  ' if r.stdout == 'active' else '[FAIL]' }} {{ '%-20s' | format(r.item) }} {{ r.stdout | default('?') }}
          {% endfor %}
          listening    : {{ hostvars['fileserver-24']['ports_24']['stdout'] | default('?') | trim }} ports{{ ' [FAIL] expected >=22' if (hostvars['fileserver-24']['ports_24']['stdout'] | default('0') | trim | int) < 22 else '' }}
          opencanary.log : {{ 'present' if hostvars['fileserver-24']['ocan_log_24']['stat']['exists'] | default(false) else '[FAIL] missing' }}
          sinkhole.json  : {{ 'present' if hostvars['fileserver-24']['sink_log_24']['stat']['exists'] | default(false) else '[FAIL] missing' }}
          disk         : {{ hostvars['fileserver-24']['disk_pct_24']['stdout'] | default('?') | trim }}%{{ ' [WARN]' if (hostvars['fileserver-24']['disk_pct_24']['stdout'] | default('0') | trim | int) >= 80 else '' }}
          {{ hostvars['fileserver-24']['disk_24']['stdout'] | default('n/a') }}
          {% else %}
          [UNREACH] .24 fileserver-24: facts not gathered
          {% endif %}

          --- Router ---
          {{ '[OK]  ' if 'running' in hostvars['router-1']['uhttpd_state']['stdout'] else '[FAIL]' }} uhttpd
          {{ '[OK]  ' if 'running' in hostvars['router-1']['adguard_state']['stdout'] else '[FAIL]' }} AdGuardHome
          disk         : {{ hostvars['router-1']['disk_pct_router']['stdout'] | default('?') | trim }}%{{ ' [WARN]' if (hostvars['router-1']['disk_pct_router']['stdout'] | default('0') | trim | int) >= 80 else '' }}
          uptime: {{ hostvars['router-1']['router_uptime']['stdout'] | default('n/a') | trim }}

          --- .15 hypervisor ---
          {% set running = hostvars['hypervisor-15']['vms_15']['stdout'] | default('') %}
          {% for vm in expected_vms %}
          {{ '[OK]  ' if vm in running else '[FAIL]' }} {{ vm }}
          {% endfor %}
          /mnt/vms free: {{ hostvars['hypervisor-15']['disk_15']['stdout'] | default('?') | trim }} GB{{ ' [WARN]' if (hostvars['hypervisor-15']['disk_15']['stdout'] | default('999') | trim | float) < 30 else '' }}
          /mnt/backup free: {{ hostvars['hypervisor-15']['disk_15_backup']['stdout'] | default('?') | trim }} GB{{ ' [WARN]' if (hostvars['hypervisor-15']['disk_15_backup']['stdout'] | default('999') | trim | float) < 20 else '' }}
          {% set octi_vbox = hostvars['hypervisor-15']['opencti_vbox_state_15']['stdout'] | default('unknown') | trim %}
          OpenCTi VMState: {{ octi_vbox }}{{ ' [FAIL] unexpected state — needs cold boot, see opencti-22.md' if octi_vbox not in ['running', 'saved', 'poweroff'] else '' }}
          ==========================================================

    - name: Fail if any service is down
      ansible.builtin.fail:
        msg: "One or more services are not active — see summary above"
      when: >
        hostvars['suricata-20']['svc_20']['results'] | selectattr('stdout', '!=', 'active') | list | length > 0
        or hostvars['elk-21']['svc_21']['results'] | default([]) | selectattr('stdout', '!=', 'active') | list | length > 0
        or ((opencti_vm_state | default('unknown')) == 'running' and hostvars['opencti-22']['svc_22']['stdout'] | default('') != 'active')
        or (hostvars['tpot-hive-23']['svc_tpot'] is defined and hostvars['tpot-hive-23']['svc_tpot']['results'] | selectattr('stdout', '!=', 'active') | list | length > 0)
        or (hostvars['fileserver-24']['svc_24'] is defined and hostvars['fileserver-24']['svc_24']['results'] | selectattr('stdout', '!=', 'active') | list | length > 0)

    - name: Fail if canary listening port count drifted
      ansible.builtin.fail:
        msg: "Canary listening port count < 22 on .24 — OpenCanary or sinkhole missing ports (expected 8 banner + 14 sinkhole)"
      when:
        - hostvars['fileserver-24']['ports_24'] is defined
        - (hostvars['fileserver-24']['ports_24']['stdout'] | default('0') | trim | int) < 22

    - name: Fail if canary log files missing
      ansible.builtin.fail:
        msg: "Canary log file(s) missing on .24 — OpenCanary or sinkhole never wrote anything"
      when:
        - hostvars['fileserver-24']['svc_24'] is defined
        - >
          not (hostvars['fileserver-24']['ocan_log_24']['stat']['exists'] | default(false))
          or not (hostvars['fileserver-24']['sink_log_24']['stat']['exists'] | default(false))

    - name: Fail if Wazuh agent count drifted
      ansible.builtin.fail:
        msg: "Wazuh enrolled agent count != 6 — check /var/ossec/etc/client.keys on .21 (existing 4 + .24 + .23 = 6 (sensor .125 retired 2026-06-07))"
      when: (hostvars['elk-21']['wazuh_agents_21']['stdout'] | default('-1') | trim | int) != 6

    - name: Fail if Wazuh API is down
      ansible.builtin.fail:
        msg: "Wazuh API not responding on .21 port 55000 — run health-check to see details"
      when: hostvars['elk-21']['wazuh_api_21']['status'] | default(-1) not in [200, 401]

    - name: Fail if router uhttpd or AdGuardHome down
      ansible.builtin.fail:
        msg: "Router uhttpd (LuCI) or AdGuardHome stopped on .1 — DNS (AdGuard) or admin UI broken"
      when: >
        'running' not in (hostvars['router-1']['uhttpd_state']['stdout'] | default(''))
        or 'running' not in (hostvars['router-1']['adguard_state']['stdout'] | default(''))

    - name: Fail if any VM not running on .15
      ansible.builtin.fail:
        msg: "One or more VMs not running on .15 — see summary above"
      when: >
        'Suricata' not in hostvars['hypervisor-15']['vms_15']['stdout'] | default('')
        or 'ELK' not in hostvars['hypervisor-15']['vms_15']['stdout'] | default('')
        or 'T-Pot Hive' not in hostvars['hypervisor-15']['vms_15']['stdout'] | default('')

    - name: Fail if .15 /mnt/vms free space critically low
      ansible.builtin.fail:
        msg: ".15 hypervisor /mnt/vms free < 20 GB — VDI growth will starve all SOC VMs (WARN at 30 GB)"
      when: (hostvars['hypervisor-15']['disk_15']['stdout'] | default('999') | trim | float) < 20

    - name: Fail if .15 /mnt/backup free space critically low
      ansible.builtin.fail:
        msg: ".15 hypervisor /mnt/backup free < 10 GB (WARN at 20 GB)"
      when: (hostvars['hypervisor-15']['disk_15_backup']['stdout'] | default('999') | trim | float) < 10

    - name: Fail if OpenCTI VM is in an unexpected VBox state
      ansible.builtin.fail:
        msg: >-
          OpenCTi VM is in VBoxManage state '{{ hostvars['hypervisor-15']['opencti_vbox_state_15']['stdout'] | default('unknown') | trim }}'
          (expected running/saved/poweroff) — likely crashed mid-run or mid-savestate.
          Recover: VBoxManage startvm OpenCTi --type headless from .15 (an 'aborted' state
          cold-boots directly, no discardstate needed) or run opencti-wake.ps1 from .13.
          See soc-lab/opencti-22.md "Aborted-state gap".
      when: (hostvars['hypervisor-15']['opencti_vbox_state_15']['stdout'] | default('unknown') | trim) not in ['running', 'saved', 'poweroff']

    # Connector-freshness gate (added 2026-07-30). Only fires when VM is
    # `running` — savestate is expected-quiet, no connectors heartbeat.
    # Threshold 300s aligns with the summary's [FAIL] marker; heartbeats
    # every ~30s in practice.
    - name: Fail if OpenCTI TI connectors are stale
      ansible.builtin.fail:
        msg: >-
          OpenCTI TI connectors have stopped heartbeating on .22 (newest heartbeat
          {{ (hostvars['opencti-22']['opencti_conn_freshness_22']['stdout'] | default('-1 unknown')).split(' ', 1)[0] }}s ago,
          stuck: {{ (hostvars['opencti-22']['opencti_conn_freshness_22']['stdout'] | default('-1 unknown')).split(' ', 1)[1] | default('') | trim }}).
          Likely the "Python retry loop after cold-boot" pathology — restart with
          `docker restart opencti-connector-{misp,threatfox,urlhaus,mitre,cisa-kev}-1 opencti-worker-1`
          on .22, or re-run opencti-wake.ps1 (patched 2026-07-30 to auto-restart on cold-boot).
          See soc-lab/opencti-22.md "Connectors stuck in Python retry loop after cold-boot".
      vars:
        _cf: "{{ (hostvars['opencti-22']['opencti_conn_freshness_22']['stdout'] | default('-1 unknown')).split(' ', 1) }}"
      when:
        - (opencti_vm_state | default('unknown')) == 'running'
        - (_cf[0] | int) > 300
        - (_cf[1] | default('') | trim) not in ['', 'no-token', 'curl-fail', 'no-connectors', 'parse-fail']

    - name: Fail if disk >= 90%
      ansible.builtin.fail:
        msg: "Disk usage >= 90% on one or more hosts — check summary above (WARN at 80%)"
      when: >
        (hostvars['suricata-20']['disk_pct_20']['stdout'] | default('0') | trim | int) >= 90
        or (hostvars['elk-21']['disk_pct_21']['stdout'] | default('0') | trim | int) >= 90
        or ((opencti_vm_state | default('unknown')) == 'running' and (hostvars['opencti-22']['disk_pct_22']['stdout'] | default('0') | trim | int) >= 90)
        or (hostvars['tpot-hive-23']['disk_pct_tpot'] is defined and (hostvars['tpot-hive-23']['disk_pct_tpot']['stdout'] | trim | int) >= 90)
        or (hostvars['router-1']['disk_pct_router'] is defined and (hostvars['router-1']['disk_pct_router']['stdout'] | trim | int) >= 90)

    - name: Fail if MISP IOC rules stale or too few
      ansible.builtin.fail:
        msg: "Suricata MISP rules pipe broken — file missing, >24h stale, or <100k rules (cron: misp-pull-rules every 6h; WARN shows at >8h)"
      when: >
        (hostvars['suricata-20']['misp_rules_age_20']['stdout'] | default('-1') | trim | int) < 0
        or (hostvars['suricata-20']['misp_rules_age_20']['stdout'] | default('0') | trim | int) > 86400
        or (hostvars['suricata-20']['misp_rules_count_20']['stdout'] | default('0') | trim | int) < 100000

    - name: Fail if MISP enabled feed count drifted
      ansible.builtin.fail:
        msg: "MISP enabled feed count != 8 — check /feeds in MISP UI for disabled/added feeds"
      when: (hostvars['elk-21']['misp_feeds_21']['stdout'] | default('-1') | trim | int) != 8

    - name: Fail if Suricata EVE log stale or missing
      ansible.builtin.fail:
        msg: "Suricata eve.json missing or > 300s stale on .20 — daemon up but SPAN/capture pipeline broken (WARN shows at >60s)"
      when: >
        (hostvars['suricata-20']['eve_age_20']['stdout'] | default('-1') | trim | int) < 0
        or (hostvars['suricata-20']['eve_age_20']['stdout'] | default('0') | trim | int) > 300

    - name: Fail if Zeek conn.log stale or missing
      ansible.builtin.fail:
        msg: "Zeek conn.log missing or > 300s stale on .20 — zeekctl reports running but SPAN tap may be broken (WARN shows at >60s)"
      when: >
        (hostvars['suricata-20']['zeek_conn_age_20']['stdout'] | default('-1') | trim | int) < 0
        or (hostvars['suricata-20']['zeek_conn_age_20']['stdout'] | default('0') | trim | int) > 300
