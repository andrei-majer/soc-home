---
- name: Pre-flight — hypervisor .15 reachable
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Ping hypervisor .15
      ansible.builtin.command: ping -c1 -W2 192.168.1.15
      register: hv_ping
      changed_when: false
      failed_when: false
    - name: Abort early if hypervisor .15 is down
      ansible.builtin.fail:
        msg: >-
          Hypervisor .15 is DOWN — every SOC VM (.120/.133/.135/.130) is
          unreachable until it is back up. Recover: WoL .15 from .13 (magic packet
          to MAC B4:2E:99:34:9C:6B), wait ~2-3 min for the VMs to cold-boot, then
          re-run this health check.
      when: hv_ping.rc != 0

- name: Health check — Suricata host (.120)
  hosts: suricata-120
  gather_facts: true
  tasks:
    - name: Check systemd services (.120)  # noqa: command-instead-of-module
      ansible.builtin.command: "systemctl is-active {{ item }}"
      loop: [suricata, snort3, fail2ban, filebeat, loki, promtail, grafana-server, evebox, velociraptor]
      register: svc_120
      failed_when: false
      changed_when: false
    - name: Disk pct (.120)
      ansible.builtin.shell: df / | awk 'NR==2{print $5}' | tr -d '%'
      register: disk_pct_120
      failed_when: false
      changed_when: false
    - name: Disk detail (.120)
      ansible.builtin.command: df -h /
      register: disk_120
      failed_when: false
      changed_when: false
    - name: Suricata rule count (.120)
      ansible.builtin.shell: |
        suricatasc -c dump-counters 2>/dev/null | python3 -c "
        import sys,json; d=json.load(sys.stdin)
        print(d.get('message',{}).get('detect',{}).get('engines',[{}])[0].get('rules_loaded','n/a'))
        " 2>/dev/null || grep -oP 'rules loaded: \K[0-9]+' /var/log/suricata/suricata.log | tail -1 || echo n/a
      args:
        executable: /bin/bash
      register: rules_120
      failed_when: false
      changed_when: false
    - name: EVE log freshness in seconds (.120)
      ansible.builtin.shell: |
        last=$(stat -c %Y /var/log/suricata/eve.json 2>/dev/null) || { echo -1; exit 0; }
        echo "$(( $(date +%s) - last ))"
      args:
        executable: /bin/bash
      register: eve_age_120
      failed_when: false
      changed_when: false
    - name: MISP IOC rules file age in seconds (.120)
      ansible.builtin.shell: |
        f=/etc/suricata/rules/misp.rules
        [ -f "$f" ] && echo $(( $(date +%s) - $(stat -c %Y "$f") )) || echo -1
      args:
        executable: /bin/bash
      register: misp_rules_age_120
      failed_when: false
      changed_when: false
    - name: MISP IOC rules line count (.120)
      ansible.builtin.shell: wc -l < /etc/suricata/rules/misp.rules 2>/dev/null || echo 0
      args:
        executable: /bin/bash
      register: misp_rules_count_120
      failed_when: false
      changed_when: false
    - name: Zeek node status (.120)
      ansible.builtin.command: /opt/zeek/bin/zeekctl status
      register: zeek_status_120
      failed_when: false
      changed_when: false
    - name: Zeek conn.log freshness in seconds (.120)
      ansible.builtin.shell: |
        f=/opt/zeek/logs/current/conn.log
        [ -f "$f" ] && echo "$(( $(date +%s) - $(stat -c %Y "$f") ))" || echo -1
      args:
        executable: /bin/bash
      register: zeek_conn_age_120
      failed_when: false
      changed_when: false

- name: Health check — ELK host (.133)
  hosts: elk-133
  gather_facts: true
  tasks:
    - name: Check systemd services (.133)  # noqa: command-instead-of-module
      ansible.builtin.command: "systemctl is-active {{ item }}"
      loop: [elasticsearch, kibana, logstash, filebeat, wazuh-manager, wazuh-dashboard, apache2, mariadb, misp-workers]
      register: svc_133
      failed_when: false
      changed_when: false
    - name: Elasticsearch cluster health (.133)
      ansible.builtin.uri:
        url: http://localhost:9200/_cluster/health
        return_content: true
      register: es_health_133
      failed_when: false
    - name: Wazuh agent count (.133)
      ansible.builtin.shell: wc -l < /var/ossec/etc/client.keys 2>/dev/null || echo 0
      args:
        executable: /bin/bash
      register: wazuh_agents_133
      failed_when: false
      changed_when: false
    - name: Wazuh API port (.133)
      ansible.builtin.uri:
        url: https://localhost:55000/
        validate_certs: false
        status_code: [200, 401]
      register: wazuh_api_133
      failed_when: false
    - name: MISP enabled feeds count (.133)
      ansible.builtin.shell: mysql misp -Nse "SELECT COUNT(*) FROM feeds WHERE enabled=1" 2>/dev/null || echo -1
      args:
        executable: /bin/bash
      register: misp_feeds_133
      failed_when: false
      changed_when: false
    - name: Disk pct (.133)
      ansible.builtin.shell: df / | awk 'NR==2{print $5}' | tr -d '%'
      register: disk_pct_133
      failed_when: false
      changed_when: false
    - name: Disk detail (.133)
      ansible.builtin.command: df -h /
      register: disk_133
      failed_when: false
      changed_when: false

- name: Health check — OpenCTI host (.135)
  hosts: opencti-135
  gather_facts: true
  tasks:
    - name: Check opencti systemd service  # noqa: command-instead-of-module
      ansible.builtin.command: systemctl is-active opencti
      register: svc_135
      failed_when: false
      changed_when: false
    - name: OpenCTI docker container count (.135)
      ansible.builtin.shell: docker compose -f /opt/opencti/docker-compose.yml ps -q 2>/dev/null | wc -l
      args:
        executable: /bin/bash
      register: docker_135
      failed_when: false
      changed_when: false
    - name: OpenCTI core restart count + uptime + status (.135)
      ansible.builtin.shell: |
        rc=$(docker inspect opencti-opencti-1 -f '{% raw %}{{.RestartCount}}{% endraw %}' 2>/dev/null || echo -1)
        st=$(docker inspect opencti-opencti-1 -f '{% raw %}{{.State.Status}}{% endraw %}' 2>/dev/null || echo unknown)
        start=$(docker inspect opencti-opencti-1 -f '{% raw %}{{.State.StartedAt}}{% endraw %}' 2>/dev/null || echo "")
        if [ -n "$start" ]; then
          secs=$(( $(date +%s) - $(date -d "$start" +%s) ))
          up_h=$(( secs / 3600 )); up_m=$(( secs / 60 ))
        else
          up_h=-1; up_m=-1
        fi
        echo "$rc $up_h $up_m $st"
      args:
        executable: /bin/bash
      register: opencti_core_135
      failed_when: false
      changed_when: false
    - name: Disk pct (.135)
      ansible.builtin.shell: df / | awk 'NR==2{print $5}' | tr -d '%'
      register: disk_pct_135
      failed_when: false
      changed_when: false
    - name: Disk detail (.135)
      ansible.builtin.command: df -h /
      register: disk_135
      failed_when: false
      changed_when: false

- name: Health check — T-Pot host (.130)
  hosts: tpot
  gather_facts: true
  tasks:
    - name: T-Pot systemd services state  # noqa: command-instead-of-module
      ansible.builtin.command: "systemctl is-active {{ item }}"
      loop: [tpot, wazuh-agent]
      register: svc_tpot
      failed_when: false
      changed_when: false
    - name: T-Pot docker container count
      ansible.builtin.shell: docker ps -q | wc -l
      args:
        executable: /bin/bash
      register: docker_tpot
      failed_when: false
      changed_when: false
    - name: Disk pct (T-Pot)
      ansible.builtin.shell: df / | awk 'NR==2{print $5}' | tr -d '%'
      register: disk_pct_tpot
      failed_when: false
      changed_when: false
    - name: Disk detail (T-Pot)
      ansible.builtin.command: df -h /
      register: disk_tpot
      failed_when: false
      changed_when: false

- name: Health check — canary (.140 fs1)
  hosts: canary
  gather_facts: true
  tasks:
    - name: Check systemd services (.140)  # noqa: command-instead-of-module
      ansible.builtin.command: "systemctl is-active {{ item }}"
      loop: [opencanary, sinkhole, wazuh-agent, smbd]
      register: svc_140
      failed_when: false
      changed_when: false
    - name: Canary listening port count (.140)
      ansible.builtin.shell: ss -tln | grep -v ':22 ' | grep -c LISTEN
      args:
        executable: /bin/bash
      register: ports_140
      failed_when: false
      changed_when: false
    - name: OpenCanary log stat (.140)
      ansible.builtin.stat:
        path: /var/tmp/opencanary.log
      register: ocan_log_140
    - name: Sinkhole log stat (.140)
      ansible.builtin.stat:
        path: /var/log/sinkhole.json
      register: sink_log_140
    - name: Disk pct (.140)
      ansible.builtin.shell: df / | awk 'NR==2{print $5}' | tr -d '%'
      register: disk_pct_140
      failed_when: false
      changed_when: false
    - name: Disk detail (.140)
      ansible.builtin.command: df -h /
      register: disk_140
      failed_when: false
      changed_when: false

- name: Health check — OpenWrt router
  hosts: openwrt
  gather_facts: false
  tasks:
    - name: Check uhttpd running
      ansible.builtin.raw: "pgrep uhttpd >/dev/null && echo running || echo stopped"
      register: uhttpd_state
      changed_when: false
    - name: Check AdGuardHome running
      ansible.builtin.raw: "pgrep AdGuardHome >/dev/null && echo running || echo stopped"
      register: adguard_state
      changed_when: false
    - name: Router disk pct
      ansible.builtin.raw: "df / | awk 'NR==2{print $5}' | tr -d %"
      register: disk_pct_router
      changed_when: false
    - name: Router uptime
      ansible.builtin.raw: uptime
      register: router_uptime
      changed_when: false

- name: Health check — hypervisor .15
  hosts: hypervisor-15
  gather_facts: false
  tasks:
    - name: List running VMs (.15)
      ansible.builtin.raw: '"C:\Program Files\Oracle\VirtualBox\VBoxManage.exe" list runningvms'
      register: vms_15
      changed_when: false
    - name: C drive free space GB (.15)
      ansible.builtin.raw: 'powershell -NoProfile -Command "[math]::Round((Get-PSDrive C).Free/1GB,1)"'
      register: disk_15
      changed_when: false

- name: Print health summary and fail on issues
  hosts: suricata-120
  gather_facts: false
  vars:
    expected_vms: ['Suricata', 'ELK', 'T-Pot Hive', 'OpenCTi', 'OpenCanary']
  tasks:
    - name: Summary table
      ansible.builtin.debug:
        msg: |
          ================= SOC LAB HEALTH SUMMARY =================
          --- .120 suricata services ---
          {% for r in hostvars['suricata-120']['svc_120']['results'] %}
          {{ '[OK]  ' if r.stdout == 'active' else '[FAIL]' }} {{ '%-20s' | format(r.item) }} {{ r.stdout | default('?') }}
          {% endfor %}
          rules loaded : {{ hostvars['suricata-120']['rules_120']['stdout'] | default('n/a') | trim }}
          {% set eve_secs = hostvars['suricata-120']['eve_age_120']['stdout'] | default('-1') | trim | int %}
          eve.json     : {{ 'missing [FAIL]' if eve_secs < 0 else (eve_secs ~ 's ago' ~ (' [FAIL]' if eve_secs > 300 else (' [WARN]' if eve_secs > 60 else ''))) }}
          {% set zk_secs = hostvars['suricata-120']['zeek_conn_age_120']['stdout'] | default('-1') | trim | int %}
          Zeek         : {{ '[OK]   running' if 'running' in (hostvars['suricata-120']['zeek_status_120']['stdout'] | default('')) else '[FAIL] not running' }}, conn.log {{ 'missing [FAIL]' if zk_secs < 0 else (zk_secs ~ 's ago' ~ (' [FAIL]' if zk_secs > 300 else (' [WARN]' if zk_secs > 60 else ''))) }}
          MISP rules   : {{ hostvars['suricata-120']['misp_rules_count_120']['stdout'] | default('?') | trim }} rules, {{ (hostvars['suricata-120']['misp_rules_age_120']['stdout'] | default('-1') | trim | int) // 3600 }}h old{{ ' [FAIL] file missing' if (hostvars['suricata-120']['misp_rules_age_120']['stdout'] | default('-1') | trim | int) < 0 else (' [WARN]' if (hostvars['suricata-120']['misp_rules_age_120']['stdout'] | default('0') | trim | int) > 28800 else '') }}
          disk         : {{ hostvars['suricata-120']['disk_pct_120']['stdout'] | default('?') | trim }}%{{ ' [WARN]' if (hostvars['suricata-120']['disk_pct_120']['stdout'] | default('0') | trim | int) >= 80 else '' }}
          {{ hostvars['suricata-120']['disk_120']['stdout'] | default('n/a') }}

          --- .133 elk services ---
          {% for r in hostvars['elk-133']['svc_133']['results'] | default([]) %}
          {{ '[OK]  ' if r.stdout == 'active' else '[FAIL]' }} {{ '%-20s' | format(r.item) }} {{ r.stdout | default('?') }}
          {% endfor %}
          ES health    : {{ hostvars['elk-133']['es_health_133']['json']['status'] | default('n/a') }}{{ ' [WARN]' if hostvars['elk-133']['es_health_133']['json']['status'] | default('') not in ['green','yellow'] else '' }}
          Wazuh agents : {{ hostvars['elk-133']['wazuh_agents_133']['stdout'] | default('n/a') | trim }}
          Wazuh API    : {{ '[OK]  ' if hostvars['elk-133']['wazuh_api_133']['status'] | default(-1) in [200, 401] else '[FAIL] port 55000 down' }}
          MISP feeds   : {{ hostvars['elk-133']['misp_feeds_133']['stdout'] | default('?') | trim }} enabled{{ ' [FAIL] expected 8' if (hostvars['elk-133']['misp_feeds_133']['stdout'] | default('-1') | trim | int) != 8 else '' }}
          disk         : {{ hostvars['elk-133']['disk_pct_133']['stdout'] | default('?') | trim }}%{{ ' [WARN]' if (hostvars['elk-133']['disk_pct_133']['stdout'] | default('0') | trim | int) >= 80 else '' }}
          {{ hostvars['elk-133']['disk_133']['stdout'] | default('n/a') }}

          --- .135 opencti ---
          {{ '[OK]  ' if hostvars['opencti-135']['svc_135']['stdout'] == 'active' else '[FAIL]' }} opencti svc
          containers   : {{ hostvars['opencti-135']['docker_135']['stdout'] | default('n/a') | trim }}
          {% set octi = (hostvars['opencti-135']['opencti_core_135']['stdout'] | default('-1 -1 -1 unknown')).split() %}
          core restarts: {{ octi[0] }} (up {{ octi[1] }}h, {{ octi[3] }}){{ ' [WARN] restart loop?' if (octi[3] != 'running') or ((octi[0] | int) > 2 and (octi[2] | int) >= 0 and (octi[2] | int) < 10) else '' }}
          disk         : {{ hostvars['opencti-135']['disk_pct_135']['stdout'] | default('?') | trim }}%{{ ' [WARN]' if (hostvars['opencti-135']['disk_pct_135']['stdout'] | default('0') | trim | int) >= 80 else '' }}
          {{ hostvars['opencti-135']['disk_135']['stdout'] | default('n/a') }}

          --- T-Pot hosts ---
          {% for h in ['tpot-hive-130'] %}
          {% if hostvars[h]['svc_tpot'] is not defined %}
          [UNREACH] {{ h }}: facts not gathered (host unreachable)
          {% else %}
          {% set bad = hostvars[h]['svc_tpot']['results'] | selectattr('stdout', '!=', 'active') | list | length %}
          {{ '[OK]  ' if bad == 0 else '[FAIL]' }} {{ h }}: containers={{ hostvars[h]['docker_tpot']['stdout'] | default('n/a') | trim }} disk={{ hostvars[h]['disk_pct_tpot']['stdout'] | default('?') | trim }}%{{ ' [WARN]' if (hostvars[h]['disk_pct_tpot']['stdout'] | default('0') | trim | int) >= 80 else '' }}{% for r in hostvars[h]['svc_tpot']['results'] %}{% if r.stdout != 'active' %} [{{ r.item }}={{ r.stdout }}]{% endif %}{% endfor %}

          {% endif %}
          {% endfor %}

          --- .140 canary services ---
          {% if hostvars['fileserver-140']['svc_140'] is defined %}
          {% for r in hostvars['fileserver-140']['svc_140']['results'] %}
          {{ '[OK]  ' if r.stdout == 'active' else '[FAIL]' }} {{ '%-20s' | format(r.item) }} {{ r.stdout | default('?') }}
          {% endfor %}
          listening    : {{ hostvars['fileserver-140']['ports_140']['stdout'] | default('?') | trim }} ports{{ ' [FAIL] expected >=22' if (hostvars['fileserver-140']['ports_140']['stdout'] | default('0') | trim | int) < 22 else '' }}
          opencanary.log : {{ 'present' if hostvars['fileserver-140']['ocan_log_140']['stat']['exists'] | default(false) else '[FAIL] missing' }}
          sinkhole.json  : {{ 'present' if hostvars['fileserver-140']['sink_log_140']['stat']['exists'] | default(false) else '[FAIL] missing' }}
          disk         : {{ hostvars['fileserver-140']['disk_pct_140']['stdout'] | default('?') | trim }}%{{ ' [WARN]' if (hostvars['fileserver-140']['disk_pct_140']['stdout'] | default('0') | trim | int) >= 80 else '' }}
          {{ hostvars['fileserver-140']['disk_140']['stdout'] | default('n/a') }}
          {% else %}
          [UNREACH] .140 fileserver-140: facts not gathered
          {% endif %}

          --- Router ---
          {{ '[OK]  ' if 'running' in hostvars['router-1']['uhttpd_state']['stdout'] else '[FAIL]' }} uhttpd
          {{ '[OK]  ' if 'running' in hostvars['router-1']['adguard_state']['stdout'] else '[FAIL]' }} AdGuardHome
          disk         : {{ hostvars['router-1']['disk_pct_router']['stdout'] | default('?') | trim }}%{{ ' [WARN]' if (hostvars['router-1']['disk_pct_router']['stdout'] | default('0') | trim | int) >= 80 else '' }}
          uptime: {{ hostvars['router-1']['router_uptime']['stdout'] | default('n/a') | trim }}

          --- .15 hypervisor ---
          {% set running = hostvars['hypervisor-15']['vms_15']['stdout'] | default('') %}
          {% for vm in expected_vms %}
          {{ '[OK]  ' if vm in running else '[FAIL]' }} {{ vm }}
          {% endfor %}
          C: free      : {{ hostvars['hypervisor-15']['disk_15']['stdout'] | default('?') | trim }} GB{{ ' [WARN]' if (hostvars['hypervisor-15']['disk_15']['stdout'] | default('999') | trim | float) < 30 else '' }}
          ==========================================================

    - name: Fail if any service is down
      ansible.builtin.fail:
        msg: "One or more services are not active — see summary above"
      when: >
        hostvars['suricata-120']['svc_120']['results'] | selectattr('stdout', '!=', 'active') | list | length > 0
        or hostvars['elk-133']['svc_133']['results'] | default([]) | selectattr('stdout', '!=', 'active') | list | length > 0
        or hostvars['opencti-135']['svc_135']['stdout'] | default('') != 'active'
        or (hostvars['tpot-hive-130']['svc_tpot'] is defined and hostvars['tpot-hive-130']['svc_tpot']['results'] | selectattr('stdout', '!=', 'active') | list | length > 0)
        or (hostvars['fileserver-140']['svc_140'] is defined and hostvars['fileserver-140']['svc_140']['results'] | selectattr('stdout', '!=', 'active') | list | length > 0)

    - name: Fail if canary listening port count drifted
      ansible.builtin.fail:
        msg: "Canary listening port count < 22 on .140 — OpenCanary or sinkhole missing ports (expected 8 banner + 14 sinkhole)"
      when:
        - hostvars['fileserver-140']['ports_140'] is defined
        - (hostvars['fileserver-140']['ports_140']['stdout'] | default('0') | trim | int) < 22

    - name: Fail if canary log files missing
      ansible.builtin.fail:
        msg: "Canary log file(s) missing on .140 — OpenCanary or sinkhole never wrote anything"
      when:
        - hostvars['fileserver-140']['svc_140'] is defined
        - >
          not (hostvars['fileserver-140']['ocan_log_140']['stat']['exists'] | default(false))
          or not (hostvars['fileserver-140']['sink_log_140']['stat']['exists'] | default(false))

    - name: Fail if Wazuh agent count drifted
      ansible.builtin.fail:
        msg: "Wazuh enrolled agent count != 6 — check /var/ossec/etc/client.keys on .133 (existing 4 + .140 + .130 = 6 (sensor .125 retired 2026-06-07))"
      when: (hostvars['elk-133']['wazuh_agents_133']['stdout'] | default('-1') | trim | int) != 6

    - name: Fail if Wazuh API is down
      ansible.builtin.fail:
        msg: "Wazuh API not responding on .133 port 55000 — run health-check to see details"
      when: hostvars['elk-133']['wazuh_api_133']['status'] | default(-1) not in [200, 401]

    - name: Fail if router uhttpd or AdGuardHome down
      ansible.builtin.fail:
        msg: "Router uhttpd (LuCI) or AdGuardHome stopped on .1 — DNS (AdGuard) or admin UI broken"
      when: >
        'running' not in (hostvars['router-1']['uhttpd_state']['stdout'] | default(''))
        or 'running' not in (hostvars['router-1']['adguard_state']['stdout'] | default(''))

    - name: Fail if any VM not running on .15
      ansible.builtin.fail:
        msg: "One or more VMs not running on .15 — see summary above"
      when: >
        'Suricata' not in hostvars['hypervisor-15']['vms_15']['stdout'] | default('')
        or 'ELK' not in hostvars['hypervisor-15']['vms_15']['stdout'] | default('')
        or 'T-Pot Hive' not in hostvars['hypervisor-15']['vms_15']['stdout'] | default('')
        or 'OpenCTi' not in hostvars['hypervisor-15']['vms_15']['stdout'] | default('')

    - name: Fail if .15 C drive free space critically low
      ansible.builtin.fail:
        msg: ".15 hypervisor C: free < 20 GB — VHD growth will starve all SOC VMs (WARN at 30 GB)"
      when: (hostvars['hypervisor-15']['disk_15']['stdout'] | default('999') | trim | float) < 20

    - name: Fail if disk >= 90%
      ansible.builtin.fail:
        msg: "Disk usage >= 90% on one or more hosts — check summary above (WARN at 80%)"
      when: >
        (hostvars['suricata-120']['disk_pct_120']['stdout'] | default('0') | trim | int) >= 90
        or (hostvars['elk-133']['disk_pct_133']['stdout'] | default('0') | trim | int) >= 90
        or (hostvars['opencti-135']['disk_pct_135']['stdout'] | default('0') | trim | int) >= 90
        or (hostvars['tpot-hive-130']['disk_pct_tpot'] is defined and (hostvars['tpot-hive-130']['disk_pct_tpot']['stdout'] | trim | int) >= 90)
        or (hostvars['router-1']['disk_pct_router'] is defined and (hostvars['router-1']['disk_pct_router']['stdout'] | trim | int) >= 90)

    - name: Fail if MISP IOC rules stale or too few
      ansible.builtin.fail:
        msg: "Suricata MISP rules pipe broken — file missing, >24h stale, or <100k rules (cron: misp-pull-rules every 6h; WARN shows at >8h)"
      when: >
        (hostvars['suricata-120']['misp_rules_age_120']['stdout'] | default('-1') | trim | int) < 0
        or (hostvars['suricata-120']['misp_rules_age_120']['stdout'] | default('0') | trim | int) > 86400
        or (hostvars['suricata-120']['misp_rules_count_120']['stdout'] | default('0') | trim | int) < 100000

    - name: Fail if MISP enabled feed count drifted
      ansible.builtin.fail:
        msg: "MISP enabled feed count != 8 — check /feeds in MISP UI for disabled/added feeds"
      when: (hostvars['elk-133']['misp_feeds_133']['stdout'] | default('-1') | trim | int) != 8

    - name: Fail if Suricata EVE log stale or missing
      ansible.builtin.fail:
        msg: "Suricata eve.json missing or > 300s stale on .120 — daemon up but SPAN/capture pipeline broken (WARN shows at >60s)"
      when: >
        (hostvars['suricata-120']['eve_age_120']['stdout'] | default('-1') | trim | int) < 0
        or (hostvars['suricata-120']['eve_age_120']['stdout'] | default('0') | trim | int) > 300

    - name: Fail if Zeek conn.log stale or missing
      ansible.builtin.fail:
        msg: "Zeek conn.log missing or > 300s stale on .120 — zeekctl reports running but SPAN tap may be broken (WARN shows at >60s)"
      when: >
        (hostvars['suricata-120']['zeek_conn_age_120']['stdout'] | default('-1') | trim | int) < 0
        or (hostvars['suricata-120']['zeek_conn_age_120']['stdout'] | default('0') | trim | int) > 300
