---
- name: Backup critical configs
  hosts: suricata-20:elk-21:opencti-22
  gather_facts: true
  vars:
    backup_timestamp: "{{ ansible_date_time.iso8601_basic_short }}"
    backup_local_dir: "/opt/soc-ansible/backups/{{ inventory_hostname }}"
  tasks:
    - name: Create local backup directory
      ansible.builtin.file:
        path: "{{ backup_local_dir }}"
        state: directory
        mode: "0750"
      delegate_to: localhost

    - name: Build archive on .20
      community.general.archive:
        path:
          - /etc/suricata
          - /etc/snort
          - /etc/fail2ban
          - /var/ossec/etc
        dest: "/tmp/soc-backup-{{ backup_timestamp }}.tar.gz"
        mode: "0600"
        format: gz
      when: inventory_hostname == "suricata-20"

    - name: Build archive on .21
      community.general.archive:
        path:
          - /etc/elasticsearch
          - /etc/kibana
          - /etc/logstash
          - /var/ossec/etc
        dest: "/tmp/soc-backup-{{ backup_timestamp }}.tar.gz"
        mode: "0600"
        format: gz
      when: inventory_hostname == "elk-21"

    - name: Build archive on .22
      community.general.archive:
        path:
          - /opt/opencti/docker-compose.yml
          - /opt/opencti/.env
          - /opt/opencti/config
        dest: "/tmp/soc-backup-{{ backup_timestamp }}.tar.gz"
        mode: "0600"
        format: gz
      when: inventory_hostname == "opencti-22"

    - name: Fetch archive to control node
      ansible.builtin.fetch:
        src: "/tmp/soc-backup-{{ backup_timestamp }}.tar.gz"
        dest: "{{ backup_local_dir }}/"
        flat: true

    - name: Remove remote temp archive
      ansible.builtin.file:
        path: "/tmp/soc-backup-{{ backup_timestamp }}.tar.gz"
        state: absent
