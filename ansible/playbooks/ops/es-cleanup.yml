---
# ES index cleanup + disk reclaim.
# Order matters: disk reclaim (journal vacuum + Wazuh archive compression)
# runs FIRST and does not depend on Elasticsearch being up, so it frees space
# even during a disk-full outage. Only then do we run the ES-API index deletes.
# (Before 2026-05-30 this playbook hard-failed on the ES health check whenever
# ES was down — exactly when you most need the cleanup to complete.)

- name: Elasticsearch index cleanup + disk reclaim
  hosts: elk-21
  gather_facts: false
  tasks:
    - name: Check disk before cleanup
      ansible.builtin.command: df -h /
      register: disk_before
      changed_when: false

    - name: Reclaim disk (journal + Wazuh archives, ES-independent)
      ansible.builtin.command: "{{ elk_reclaim_script | default('/usr/local/bin/elk-disk-reclaim.sh') }}"
      register: reclaim_result
      changed_when: true

    - name: Run elk-cleanup.py (ES index retention — needs ES up)
      ansible.builtin.command: "{{ elk_cleanup_script | default('/usr/local/bin/elk-cleanup.py') }}"
      register: cleanup_result
      changed_when: "'Deleted' in cleanup_result.stdout"
      failed_when: false

    - name: Retry failed shard allocation (in case disk was blocking)
      ansible.builtin.uri:
        url: http://localhost:9200/_cluster/reroute?retry_failed=true
        method: POST
        body_format: json
        body: {}
      register: reroute_result
      changed_when: false
      failed_when: false

    - name: Check ES cluster health (non-fatal — ES may still be starting)
      ansible.builtin.uri:
        url: http://localhost:9200/_cluster/health
        return_content: true
      register: es_health
      changed_when: false
      failed_when: false

    - name: Check disk after cleanup
      ansible.builtin.command: df -h /
      register: disk_after
      changed_when: false

    - name: Show results
      ansible.builtin.debug:
        msg: |
          === Disk before ===
          {{ disk_before.stdout }}
          === reclaim output ===
          {{ reclaim_result.stdout | default('(none)') }}
          === elk-cleanup.py output ===
          {{ cleanup_result.stdout | default('(skipped/failed — ES down?)') }}
          === ES cluster status: {{ es_health.json.status | default('n/a — ES not responding') }}{% if es_health.json is defined %} (unassigned: {{ es_health.json.unassigned_shards }}){% endif %} ===
          === Disk after ===
          {{ disk_after.stdout }}
