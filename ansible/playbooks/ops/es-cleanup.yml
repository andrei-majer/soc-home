---
# ES index cleanup + Wazuh archive compression
# Runs elk-cleanup.py and also compresses uncompressed Wazuh archives
# older than today (the Wazuh built-in rotation has proven unreliable
# when disk pressure blocks it mid-run, leaving GBs of raw .json/.log).

- name: Elasticsearch index cleanup
  hosts: elk-133
  gather_facts: false
  tasks:
    - name: Check disk before cleanup
      ansible.builtin.command: df -h /
      register: disk_before
      changed_when: false

    - name: Run elk-cleanup.py
      ansible.builtin.command: /usr/local/bin/elk-cleanup.py
      register: cleanup_result
      changed_when: "'Deleted' in cleanup_result.stdout"

    - name: Find uncompressed Wazuh archives (older than today)
      ansible.builtin.find:
        paths: /var/ossec/logs/archives
        recurse: true
        patterns: "ossec-archive-*.json,ossec-archive-*.log"
        age: 1d
      register: uncompressed_archives

    - name: Compress old Wazuh archives with gzip
      ansible.builtin.command: gzip "{{ item.path }}"
      loop: "{{ uncompressed_archives.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      changed_when: true
      when: uncompressed_archives.files | length > 0

    - name: Retry failed shard allocation (in case disk was blocking)
      ansible.builtin.uri:
        url: http://localhost:9200/_cluster/reroute?retry_failed=true
        method: POST
        body_format: json
        body: {}
      register: reroute_result
      changed_when: false
      failed_when: false

    - name: Check ES cluster health
      ansible.builtin.uri:
        url: http://localhost:9200/_cluster/health
        return_content: true
      register: es_health
      changed_when: false

    - name: Check disk after cleanup
      ansible.builtin.command: df -h /
      register: disk_after
      changed_when: false

    - name: Show results
      ansible.builtin.debug:
        msg: |
          === Disk before ===
          {{ disk_before.stdout }}
          === elk-cleanup.py output ===
          {{ cleanup_result.stdout }}
          === Wazuh archives compressed: {{ uncompressed_archives.files | length }} files ===
          === ES cluster status: {{ es_health.json.status }} (unassigned: {{ es_health.json.unassigned_shards }}) ===
          === Disk after ===
          {{ disk_after.stdout }}
