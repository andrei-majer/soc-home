---
# SOC Lab — Full Convergence Playbook
# Usage:
#   ansible-playbook playbooks/site.yml              # all hosts
#   ansible-playbook playbooks/site.yml --limit elk-133
#   ansible-playbook playbooks/site.yml --check      # dry run

# Play 1: Common baseline (managed Debian hosts only, NOT T-Pot)
- name: Common baseline
  hosts: debian
  roles:
    - common

# Play 2: Suricata IDS host (.120)
- name: Suricata host
  hosts: suricata-120
  roles:
    - suricata

# Play 3: ELK/SIEM host (.133)
- name: ELK host
  hosts: elk-133
  roles:
    - elk
    - wazuh-manager
    - misp

# Play 4: OpenCTI host (.135)
- name: OpenCTI host
  hosts: opencti-135
  roles:
    - opencti

# Play 5: T-Pot backup (pull-only, no changes pushed)
- name: T-Pot config backup
  hosts: tpot
  roles:
    - tpot

# Play 5b: T-Pot NTP configuration (OS-level only, no T-Pot software changes)
- name: T-Pot NTP
  hosts: tpot
  tags: ntp
  handlers:
    - name: Restart timesyncd
      ansible.builtin.service:
        name: systemd-timesyncd
        state: restarted
  tasks:
    - name: Create timesyncd drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/timesyncd.conf.d
        state: directory
        mode: "0755"
        owner: root
        group: root

    - name: Configure NTP server (timesyncd drop-in)
      ansible.builtin.copy:
        dest: /etc/systemd/timesyncd.conf.d/local.conf
        content: |
          [Time]
          NTP={{ ntp_server }}
          FallbackNTP=0.debian.pool.ntp.org 1.debian.pool.ntp.org
        mode: "0644"
        owner: root
        group: root
      notify: Restart timesyncd

# Play 6: OpenWrt router backup (raw module, pull-only)
- name: OpenWrt router backup
  hosts: openwrt
  gather_facts: false    # No Python on OpenWrt
  roles:
    - openwrt

# Play 7: Windows NTP configuration (.15 hypervisor)
- name: Windows NTP
  hosts: hypervisor-15
  gather_facts: false
  tags: ntp
  tasks:
    - name: Configure w32tm to use local NTP server
      ansible.builtin.raw: >
        w32tm /config /manualpeerlist:{{ ntp_server }} /syncfromflags:manual /reliable:YES /update &&
        net stop w32time && net start w32time &&
        w32tm /resync /force
      register: w32tm_result
      changed_when: true

    - name: Show w32tm output
      ansible.builtin.debug:
        var: w32tm_result.stdout_lines
