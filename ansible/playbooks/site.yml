---
# SOC Lab — Full Convergence Playbook
# Usage:
#   ansible-playbook playbooks/site.yml              # all hosts
#   ansible-playbook playbooks/site.yml --limit elk-133
#   ansible-playbook playbooks/site.yml --check      # dry run

# Play 1: Common baseline (managed Debian hosts only, NOT T-Pot)
- name: Common baseline
  hosts: debian
  roles:
    - common

# Play 2: Suricata IDS host (.120)
- name: Suricata host
  hosts: suricata-120
  roles:
    - suricata
    - backups
    - soc-contain

# Play 3: ELK/SIEM host (.133)
- name: ELK host
  hosts: elk-133
  roles:
    - elk
    - wazuh-manager
    - misp
    - backups

# Play 4: OpenCTI host (.135)
- name: OpenCTI host
  hosts: opencti-135
  roles:
    - opencti
    - backups

# Play 5: T-Pot backup (pull-only, no changes pushed)
- name: T-Pot config backup
  hosts: tpot
  roles:
    - tpot

# Play 5b: T-Pot NTP configuration (OS-level only, no T-Pot software changes)
- name: T-Pot NTP
  hosts: tpot
  tags: ntp
  handlers:
    - name: Restart timesyncd
      ansible.builtin.service:
        name: systemd-timesyncd
        state: restarted
  tasks:
    - name: Create timesyncd drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/timesyncd.conf.d
        state: directory
        mode: "0755"
        owner: root
        group: root

    - name: Configure NTP server (timesyncd drop-in)
      ansible.builtin.copy:
        dest: /etc/systemd/timesyncd.conf.d/local.conf
        content: |
          [Time]
          NTP={{ ntp_server }}
          FallbackNTP=0.debian.pool.ntp.org 1.debian.pool.ntp.org
        mode: "0644"
        owner: root
        group: root
      notify: Restart timesyncd

# Play 6: OpenWrt router backup (raw module, pull-only)
- name: OpenWrt router backup
  hosts: openwrt
  gather_facts: false    # No Python on OpenWrt
  roles:
    - openwrt

# Play 7: Hypervisor .15 host stack (re-added 2026-07-06 — was runbook-only).
# Brings the .15 HOST config under Ansible so a reinstall no longer silently
# drops host-side units (as the ups-loki collector was on the 2026-07-02
# reinstall). First pass = Docker storage guardrails; scope grows over time.
# See roles/hypervisor. NOTE: the control node .120 is a VM on .15, so this play
# can only run once .120 is up (fine — host-stack rebuild follows VM restore).
- name: Hypervisor host stack (.15)
  hosts: hypervisor
  become: true
  roles:
    - hypervisor

# Play 8: Canary host (.140 fs1) — internal trip-wire
- name: Canary host
  hosts: canary
  become: true
  roles:
    - common
    - canary

# Play 9: Canary cutover on .120 (decommission legacy sinkhole) — COMPLETE 2026-06.
# Tagged `never` so it is SKIPPED on normal converges; run on demand only for a
# re-cutover / DR with:  ansible-playbook playbooks/site.yml --tags canary_cutover
- name: Canary cutover on .120
  hosts: suricata-120
  become: true
  roles:
    - canary
  tags:
    - canary_cutover
    - never
