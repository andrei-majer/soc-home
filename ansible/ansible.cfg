[defaults]
inventory = inventory/hosts.yml
vault_password_file = ~/.vault_pass
host_key_checking = False
roles_path = roles
retry_files_enabled = False
stdout_callback = default
result_format = yaml
timeout = 30

[privilege_escalation]
become = false

[ssh_connection]
# ServerAlive* detects a wedged session (TCP up but sshd hung, e.g. tpot-hive 2026-05-21) and
# fails the host in ~45s (15s x 3) instead of hanging forever. Keepalives do not interrupt
# active long-running tasks. ControlMaster/Persist preserved from ansible defaults.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15 -o ServerAliveCountMax=3
