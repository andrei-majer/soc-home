# Managed by Ansible
[Unit]
# Auto-restart rate limiter: 3 attempts in 5 min, then give up
StartLimitBurst=3
StartLimitIntervalSec=300

[Service]
# Extended timeout — wazuh-control start can be slow under load
TimeoutSec=180
# Auto-recover from transient startup races (e.g. wazuh-apid hitting core
# daemons before they are ready on first boot)
Restart=on-failure
RestartSec=15s
