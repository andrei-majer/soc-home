---
# ============================================================================
# wazuh-manager role — ossec.conf, rules, ntfy, TAXII, dashboard
# Targets the .133 host (elk-21)
# ============================================================================

# ---------- Wazuh apt repository ----------
- name: Download Wazuh GPG key
  ansible.builtin.get_url:
    url: https://packages.wazuh.com/key/GPG-KEY-WAZUH
    dest: /tmp/wazuh-gpg-key.asc
    mode: "0644"

- name: Dearmor Wazuh GPG key
  ansible.builtin.command:
    cmd: gpg --dearmor -o /usr/share/keyrings/wazuh.gpg /tmp/wazuh-gpg-key.asc
    creates: /usr/share/keyrings/wazuh.gpg

- name: Add Wazuh apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/wazuh.gpg] https://packages.wazuh.com/4.x/apt/ stable main"
    state: present
    filename: wazuh

- name: Ensure wazuh-agent is absent (conflicts with wazuh-manager)
  ansible.builtin.apt:
    name: wazuh-agent
    state: absent

# ---------- Wazuh Manager core configuration ----------

- name: Deploy ossec.conf
  ansible.builtin.template:
    src: ossec.conf.j2
    dest: "{{ wazuh_ossec_conf }}"
    owner: root
    group: wazuh
    mode: "0660"
    backup: true
  notify:
    - Restart wazuh-manager

- name: Deploy local_rules.xml
  ansible.builtin.copy:
    src: local_rules.xml
    dest: "{{ wazuh_local_rules }}"
    owner: wazuh
    group: wazuh
    mode: "0660"
    backup: true
  notify:
    - Restart wazuh-manager

# Semantic gate: load the full ruleset in analysisd test mode before any
# restart. Wazuh rule files are multi-<group> fragments (NOT single-root XML,
# so xmllint is unsuitable); analysisd -t is the Wazuh-aware validator and
# catches malformed XML, duplicate IDs, and bad schema. A failure here aborts
# the play, so the running manager is never restarted onto a broken ruleset.
- name: Validate Wazuh ruleset loads cleanly (analysisd test)
  ansible.builtin.command: /var/ossec/bin/wazuh-analysisd -t
  register: wazuh_ruleset_test
  changed_when: false
  failed_when: wazuh_ruleset_test.rc != 0

- name: Deploy Wazuh API config (api.yaml)
  ansible.builtin.template:
    src: api.yaml.j2
    dest: "{{ wazuh_api_config }}"
    owner: root
    group: wazuh
    mode: "0660"
    backup: true
  notify:
    - Restart wazuh-manager

# ---------- telegram integration (active; ntfy kept for rollback) ----------

- name: Deploy custom-telegram integration script
  ansible.builtin.copy:
    src: custom-telegram
    dest: "{{ wazuh_telegram_script }}"
    owner: root
    group: wazuh
    mode: "0750"
  notify:
    - Restart wazuh-manager

- name: Deploy custom-ntfy integration script (retired; left on disk for rollback)
  ansible.builtin.copy:
    src: custom-ntfy
    dest: "{{ wazuh_ntfy_script }}"
    owner: root
    group: wazuh
    mode: "0750"
  notify:
    - Restart wazuh-manager

# ---------- soc-contain AR ----------

- name: Render soc-contain auth token for AR
  ansible.builtin.copy:
    content: "{{ vault_soc_contain_recv_token }}"
    dest: "{{ wazuh_soc_contain_token_path }}"
    owner: root
    group: wazuh
    mode: '0640'
  no_log: true
  notify: Restart wazuh-manager

- name: Deploy notify-contain AR script
  ansible.builtin.template:
    src: notify-contain.j2
    dest: /var/ossec/active-response/bin/notify-contain
    owner: root
    group: wazuh
    mode: '0750'
  notify: Restart wazuh-manager

# ---------- OpenCTI TAXII pull ----------

- name: Deploy opencti-taxii.py pull script
  ansible.builtin.template:
    src: opencti-taxii.py.j2
    dest: "{{ wazuh_taxii_script }}"
    owner: root
    group: root
    mode: "0750"

- name: Deploy opencti-taxii cron
  ansible.builtin.copy:
    src: opencti-taxii.cron
    dest: "{{ wazuh_taxii_cron }}"
    owner: root
    group: root
    mode: "0644"

# ---------- systemd drop-in: extend TimeoutSec ----------

- name: Ensure wazuh-manager systemd drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/wazuh-manager.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy wazuh-manager TimeoutSec drop-in
  ansible.builtin.copy:
    src: wazuh-timeout.conf
    dest: /etc/systemd/system/wazuh-manager.service.d/timeout.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart wazuh-manager

# ---------- Wazuh Dashboard config + vendor patches ----------

- name: Deploy Wazuh Dashboard config
  ansible.builtin.template:
    src: opensearch_dashboards.yml.j2
    dest: "{{ wazuh_dashboard_config }}"
    owner: root
    group: wazuh-dashboard
    mode: "0640"
    backup: true
  notify:
    - Restart wazuh-dashboard

- name: Patch statistics-template.json — dateOptionalTime -> strict_date_optional_time
  ansible.builtin.replace:
    path: /usr/share/wazuh-dashboard/plugins/wazuh/server/integration-files/statistics-template.json
    regexp: "dateOptionalTime"
    replace: "strict_date_optional_time"
  notify:
    - Restart wazuh-dashboard

- name: Patch monitoring-template.js — dateOptionalTime -> strict_date_optional_time
  ansible.builtin.replace:
    path: /usr/share/wazuh-dashboard/plugins/wazuh/server/integration-files/monitoring-template.js
    regexp: "dateOptionalTime"
    replace: "strict_date_optional_time"
  notify:
    - Restart wazuh-dashboard

# ---------- Services ----------

- name: Ensure wazuh-manager is enabled and running
  ansible.builtin.systemd:
    name: wazuh-manager
    state: started
    enabled: true

- name: Ensure wazuh-dashboard is enabled and running
  ansible.builtin.systemd:
    name: wazuh-dashboard
    state: started
    enabled: true
