[INCLUDES]
before = common.conf

[Definition]
# Parses Suricata EVE JSON alert lines (one JSON object per line).
# Three match tiers — any match counts as one failure against the threshold:
#
#   Tier 1: severity 1 or 2 (critical / major)
#   Tier 2: high-confidence categories regardless of severity
#   Tier 3: iprep hits — already known-bad IPs, ban on first alert
#
# Internal IPs are excluded via ignoreip in the jail config.
# src_ip is matched with <HOST>; dest_ip (internal host) is left unmatched.

failregex = ^.*"event_type":"alert".*"src_ip":"<HOST>".*"severity":[12]\b
            ^.*"event_type":"alert".*"src_ip":"<HOST>".*"category":"(?:A Network Trojan was Detected|Malware Command and Control Activity Detected|Attempted Administrator Privilege Gain|Attempted User Privilege Gain|Web Application Attack|Exploit Kit Activity Detected|Targeted Malicious Activity was Detected|Successful Administrator Privilege Gain|Successful User Privilege Gain)[^"]*"
            ^.*"event_type":"alert".*"src_ip":"<HOST>".*"signature":"IPREP

ignoreregex =

# EVE timestamp format: "timestamp":"2026-03-01T12:34:56.789012+0200"
datepattern = "timestamp":"%%Y-%%m-%%dT%%H:%%M:%%S
