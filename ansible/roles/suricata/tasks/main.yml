---
# ============================================================================
# Suricata role - manages Suricata IDS, Snort 3, fail2ban, Filebeat,
# iprep feeds, MISP integration, Arkime, Velociraptor, and suricata-enforcer
# on the .120 host.
# ============================================================================

# ---------- Wazuh apt repository ----------
- name: Download Wazuh GPG key
  ansible.builtin.get_url:
    url: https://packages.wazuh.com/key/GPG-KEY-WAZUH
    dest: /tmp/wazuh-gpg-key.asc
    mode: "0644"

- name: Dearmor Wazuh GPG key
  ansible.builtin.command:
    cmd: gpg --dearmor -o /usr/share/keyrings/wazuh.gpg /tmp/wazuh-gpg-key.asc
    creates: /usr/share/keyrings/wazuh.gpg

- name: Add Wazuh apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/wazuh.gpg] https://packages.wazuh.com/4.x/apt/ stable main"
    state: present
    filename: wazuh

# ---------- Network interface (promiscuous mode) ----------

- name: Deploy promiscuous mode interface config
  ansible.builtin.copy:
    src: enp0s8-promisc
    dest: "{{ promisc_interface_config }}"
    owner: root
    group: root
    mode: "0644"

# ---------- Suricata IDS ----------

- name: Deploy suricata.yaml
  ansible.builtin.template:
    src: suricata.yaml.j2
    dest: "{{ suricata_config }}"
    owner: root
    group: root
    mode: "0640"
    backup: true
  notify:
    - Reload suricata rules

- name: Deploy threshold.config
  ansible.builtin.copy:
    src: threshold.config
    dest: "{{ suricata_threshold_config }}"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload suricata rules

- name: Deploy suricata-update config (update.yaml)
  ansible.builtin.copy:
    src: update.yaml
    dest: "{{ suricata_update_yaml }}"
    owner: root
    group: root
    mode: "0644"

- name: Deploy suricata logrotate config
  ansible.builtin.copy:
    src: suricata
    dest: /etc/logrotate.d/suricata
    owner: root
    group: root
    mode: "0644"

- name: Deploy suricata defaults (Debian)
  ansible.builtin.copy:
    src: defaults-debian.conf
    dest: /etc/default/suricata
    owner: root
    group: root
    mode: "0644"
  notify:
    - Restart suricata

- name: Ensure suricata iprep directory exists
  ansible.builtin.file:
    path: "{{ suricata_iprep_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy iprep categories.txt
  ansible.builtin.copy:
    src: categories.txt
    dest: "{{ suricata_iprep_dir }}/categories.txt"
    owner: root
    group: root
    mode: "0644"

- name: Deploy suricata EVE logrotate config
  ansible.builtin.copy:
    src: suricata-eve.conf
    dest: /etc/logrotate.d/suricata-eve
    owner: root
    group: root
    mode: "0644"

- name: Ensure suricata is enabled and running
  ansible.builtin.systemd:
    name: suricata
    state: started
    enabled: true

- name: Configure suricata-update cron
  ansible.builtin.cron:
    name: "suricata-update"
    hour: "{{ suricata_update_cron_hour }}"
    minute: "{{ suricata_update_cron_minute }}"
    job: "/usr/bin/suricata-update && /usr/bin/systemctl restart suricata"
    user: root

# ---------- IP Reputation feeds ----------

- name: Deploy iprep update script
  ansible.builtin.copy:
    src: suricata-iprep-update.sh
    dest: "{{ iprep_update_script }}"
    owner: root
    group: root
    mode: "0755"

- name: Configure iprep update cron
  ansible.builtin.cron:
    name: "suricata-iprep-update"
    hour: "{{ iprep_cron_hours }}"
    minute: "15"
    job: "{{ iprep_update_script }}"
    user: root

# ---------- MISP integration ----------

- name: Deploy MISP pull rules script
  ansible.builtin.template:
    src: misp-pull-rules.sh.j2
    dest: "{{ misp_pull_script }}"
    owner: root
    group: root
    mode: "0755"

- name: Deploy MISP push sightings script
  ansible.builtin.template:
    src: misp-push-sightings.py.j2
    dest: "{{ misp_push_script }}"
    owner: root
    group: root
    mode: "0755"

- name: Configure MISP pull cron
  ansible.builtin.cron:
    name: "misp-pull-rules"
    hour: "{{ misp_pull_cron_hours }}"
    minute: "0"
    job: "{{ misp_pull_script }}"
    user: root

- name: Configure MISP push sightings cron
  ansible.builtin.cron:
    name: "misp-push-sightings"
    hour: "{{ misp_pull_cron_hours }}"
    minute: "{{ misp_push_cron_minute }}"
    job: "{{ misp_push_script }}"
    user: root

# ---------- WAN IP updater ----------

- name: Deploy WAN IP update script
  ansible.builtin.template:
    src: update-wan-ip.sh.j2
    dest: "{{ wan_ip_script }}"
    owner: root
    group: root
    mode: "0755"

- name: Configure WAN IP update cron
  ansible.builtin.cron:
    name: "update-wan-ip"
    minute: "*/5"
    job: "{{ wan_ip_script }}"
    user: root

