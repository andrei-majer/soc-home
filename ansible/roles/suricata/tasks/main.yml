# ---------- SOC Ansible state collector (Phase 3.5) ----------

- name: Ensure SOC Ansible state log directory exists
  ansible.builtin.file:
    path: /var/log/soc-ansible
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure SOC Ansible state log file exists
  ansible.builtin.file:
    path: /var/log/soc-ansible/state.jsonl
    state: touch
    owner: root
    group: root
    mode: "0644"
    modification_time: preserve
    access_time: preserve

- name: Deploy SOC Ansible state collector wrapper
  ansible.builtin.copy:
    src: soc-ansible-state.sh
    dest: /usr/local/bin/soc-ansible-state.sh
    owner: root
    group: root
    mode: "0755"

- name: Deploy SOC Ansible state logrotate config
  ansible.builtin.copy:
    src: soc-ansible-logrotate
    dest: /etc/logrotate.d/soc-ansible
    owner: root
    group: root
    mode: "0644"

- name: Deploy Grafana dashboard provider config (SOC Dashboards folder)
  ansible.builtin.copy:
    src: grafana-dashboards-provider.yaml
    dest: /etc/grafana/provisioning/dashboards/snort3.yaml
    owner: root
    group: grafana
    mode: "0640"
  notify: Restart grafana-server

- name: Deploy SOC Ansible state Grafana dashboard
  ansible.builtin.copy:
    src: soc-ansible-state.json
    dest: /etc/grafana/provisioning/dashboards/soc-ansible-state.json
    owner: root
    group: grafana
    mode: "0640"

- name: Deploy UPS (NUT/Loki) Grafana dashboards
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/grafana/provisioning/dashboards/{{ item }}"
    owner: root
    group: grafana
    mode: "0640"
  loop:
    - ups-15.json            # .15 hypervisor (resilient suspend)
    - ups-router-1.json      # .1 router (edge mains-loss signal)
    - ups-workstation-13.json  # .13 workstation (Richcomm, WinUSB+pyusb collector)
  notify: Restart grafana-server

- name: Schedule SOC Ansible state collection (every 15 min)
  ansible.builtin.cron:
    name: "soc-ansible-state-collect"
    minute: "*/15"
    job: "/usr/local/bin/soc-ansible-state.sh >/dev/null 2>&1"
    user: root

- name: Schedule SOC Ansible drift check (every 4h)
  ansible.builtin.cron:
    name: "soc-ansible-state-drift"
    minute: "0"
    hour: "*/4"
    job: "/usr/local/bin/soc-ansible-state.sh --drift >/dev/null 2>&1"
    user: root

# ---------- Zeek (network security monitor on the SPAN interface) ----------

- name: Add Zeek apt signing key
  ansible.builtin.get_url:
    url: https://download.opensuse.org/repositories/security:zeek/Debian_12/Release.key
    dest: /etc/apt/trusted.gpg.d/security_zeek.asc
    mode: "0644"

- name: Add Zeek apt repository
  ansible.builtin.apt_repository:
    repo: "deb http://download.opensuse.org/repositories/security:/zeek/Debian_12/ /"
    filename: "security:zeek"
    state: present

- name: Install Zeek
  ansible.builtin.apt:
    name: zeek-lts
    state: present
    update_cache: true

- name: Deploy Zeek node.cfg (standalone, SPAN interface)
  ansible.builtin.template:
    src: zeek-node.cfg.j2
    dest: "{{ zeek_prefix }}/etc/node.cfg"
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Deploy Zeek

- name: Enable Zeek JSON logs with ISO8601 timestamps
  ansible.builtin.blockinfile:
    path: "{{ zeek_prefix }}/share/zeek/site/local.zeek"
    marker: "# {mark} ANSIBLE MANAGED — JSON output"
    block: |
      redef LogAscii::use_json = T;
      redef LogAscii::json_timestamps = JSON::TS_ISO8601;
  notify: Deploy Zeek

# The JSON block above already gives JSON + ISO8601 output. A manual
# `@load policy/tuning/json-logs` (added during a json-streaming-logs trial) is
# redundant drift — keep it out so local.zeek matches Ansible intent.
- name: Drop redundant json-logs tuning load from local.zeek
  ansible.builtin.lineinfile:
    path: "{{ zeek_prefix }}/share/zeek/site/local.zeek"
    regexp: '^@load policy/tuning/json-logs\s*$'
    state: absent
  notify: Deploy Zeek

- name: Deploy Zeek large-transfer exfil-detection script
  ansible.builtin.copy:
    src: large-transfer.zeek
    dest: "{{ zeek_prefix }}/share/zeek/site/large-transfer.zeek"
    owner: root
    group: root
    mode: "0644"
  notify: Deploy Zeek

- name: Set Site::local_nets and load large-transfer detection in local.zeek
  ansible.builtin.blockinfile:
    path: "{{ zeek_prefix }}/share/zeek/site/local.zeek"
    marker: "# {mark} ANSIBLE MANAGED — exfil detection"
    block: |
      redef Site::local_nets += { 192.168.1.0/24, 10.0.0.0/24 };
      @load ./large-transfer.zeek
  notify: Deploy Zeek

- name: Set Zeek log retention/cleanup in zeekctl.cfg
  ansible.builtin.lineinfile:
    path: "{{ zeek_prefix }}/etc/zeekctl.cfg"
    regexp: "^{{ item.key }} ="
    line: "{{ item.key }} = {{ item.value }}"
  loop:
    - { key: "LogExpireInterval", value: "{{ zeek_log_expire_days }}" }
    - { key: "StatsLogExpireInterval", value: "{{ zeek_log_expire_days }}" }
    - { key: "CrashExpireInterval", value: "{{ zeek_log_expire_days }}" }
  loop_control:
    label: "{{ item.key }}"
  notify: Deploy Zeek

- name: Schedule zeekctl cron (rotate, archive, expire, restart-if-crashed)
  ansible.builtin.cron:
    name: "zeekctl"
    minute: "*/5"
    job: "{{ zeek_prefix }}/bin/zeekctl cron >/dev/null 2>&1"
    user: root

- name: Check Zeek node status
  ansible.builtin.command: "{{ zeek_prefix }}/bin/zeekctl status"
  register: zeek_status
  changed_when: false
  failed_when: false

- name: Deploy Zeek if not running
  ansible.builtin.command: "{{ zeek_prefix }}/bin/zeekctl deploy"
  when: "'running' not in zeek_status.stdout"
  changed_when: true

# ---------- Zeek in Grafana (Elasticsearch datasource + dashboard) ----------

- name: Deploy Grafana Zeek Elasticsearch datasource
  ansible.builtin.template:
    src: grafana-zeek-datasource.yaml.j2
    dest: /etc/grafana/provisioning/datasources/zeek-es.yaml
    owner: root
    group: grafana
    mode: "0640"
  notify: Restart grafana-server

- name: Deploy Zeek Grafana dashboard
  ansible.builtin.copy:
    src: zeek-grafana-dashboard.json
    dest: /etc/grafana/provisioning/dashboards/zeek-nsm.json
    owner: root
    group: grafana
    mode: "0640"
  notify: Restart grafana-server

# ---------- Zeek -> Wazuh agent (lean integration) ----------
# The .120 agent ossec.conf is NOT fully templated by Ansible (set up manually),
# so append only the Zeek localfiles via a marker-delimited block. Wazuh's
# built-in JSON decoder parses these; manager local rules 1002xx do the alerting.
- name: Add Zeek log inputs to Wazuh agent (notice + dns)
  ansible.builtin.blockinfile:
    path: /var/ossec/etc/ossec.conf
    marker: "<!-- {mark} ANSIBLE MANAGED: Zeek localfiles -->"
    insertafter: EOF
    block: |
      <ossec_config>
        <localfile>
          <log_format>json</log_format>
          <location>/opt/zeek/logs/current/notice.log</location>
        </localfile>
        <localfile>
          <log_format>json</log_format>
          <location>/opt/zeek/logs/current/dns.log</location>
        </localfile>
      </ossec_config>
  notify: Restart wazuh-agent

# ---------- Zeek -> EveBox bridge ----------
# Translates Zeek conn/ssl/http JSON to Suricata EVE so EveBox renders Zeek
# flow/TLS/HTTP metadata next to alerts. Writes a STANDALONE /var/log/zeek-eve/
# eve.json that EveBox reads as a 2nd input — never Suricata's eve.json (the .120
# Wazuh agent reads that directly; Zeek's wide records would overflow its JSON
# decoder). Runs as the evebox user (already in the zeek group → reads the logs).
# NOTE: the matching EveBox input-path lives in hand-maintained evebox.yaml —
# EveBox itself is not Ansible-managed. See memory soc-lab/zeek-evebox-bridge.md.
- name: Create zeek-to-eve output directory
  ansible.builtin.file:
    path: /var/log/zeek-eve
    state: directory
    owner: evebox
    group: evebox
    mode: "0750"

- name: Deploy zeek-to-eve translator script
  ansible.builtin.copy:
    src: zeek-to-eve.py
    dest: /usr/local/bin/zeek-to-eve.py
    owner: root
    group: root
    mode: "0755"
  notify: Restart zeek-to-eve

- name: Deploy zeek-to-eve systemd unit
  ansible.builtin.copy:
    src: zeek-to-eve.service
    dest: /etc/systemd/system/zeek-to-eve.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart zeek-to-eve

- name: Deploy zeek-to-eve logrotate config
  ansible.builtin.copy:
    src: zeek-eve.logrotate
    dest: /etc/logrotate.d/zeek-eve
    owner: root
    group: root
    mode: "0644"

- name: Enable and start zeek-to-eve
  ansible.builtin.systemd:
    name: zeek-to-eve
    enabled: true
    state: started
    daemon_reload: true
