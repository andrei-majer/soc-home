---
# ============================================================================
# Suricata role - manages Suricata IDS, Snort 3, fail2ban, Filebeat,
# iprep feeds, MISP integration, Arkime, Velociraptor, and suricata-enforcer
# on the .120 host.
# ============================================================================

# ---------- Wazuh apt repository ----------
- name: Download Wazuh GPG key
  ansible.builtin.get_url:
    url: https://packages.wazuh.com/key/GPG-KEY-WAZUH
    dest: /tmp/wazuh-gpg-key.asc
    mode: "0644"

- name: Dearmor Wazuh GPG key
  ansible.builtin.command:
    cmd: gpg --dearmor -o /usr/share/keyrings/wazuh.gpg /tmp/wazuh-gpg-key.asc
    creates: /usr/share/keyrings/wazuh.gpg

- name: Add Wazuh apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/wazuh.gpg] https://packages.wazuh.com/4.x/apt/ stable main"
    state: present
    filename: wazuh

# ---------- Network interface (promiscuous mode) ----------

- name: Deploy promiscuous mode interface config
  ansible.builtin.copy:
    src: enp0s8-promisc
    dest: "{{ promisc_interface_config }}"
    owner: root
    group: root
    mode: "0644"

# ---------- Suricata IDS ----------

- name: Deploy suricata.yaml
  ansible.builtin.template:
    src: suricata.yaml.j2
    dest: "{{ suricata_config }}"
    owner: root
    group: root
    mode: "0640"
    backup: true
  notify:
    - Reload suricata rules

- name: Deploy Suricata local rules
  ansible.builtin.copy:
    src: local.rules
    dest: /var/lib/suricata/rules/local.rules
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload suricata rules

- name: Deploy threshold.config
  ansible.builtin.copy:
    src: threshold.config
    dest: "{{ suricata_threshold_config }}"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload suricata rules

- name: Deploy suricata-update config (update.yaml)
  ansible.builtin.copy:
    src: update.yaml
    dest: "{{ suricata_update_yaml }}"
    owner: root
    group: root
    mode: "0644"

- name: Deploy suricata logrotate config
  ansible.builtin.copy:
    src: suricata
    dest: /etc/logrotate.d/suricata
    owner: root
    group: root
    mode: "0644"

- name: Deploy suricata defaults (Debian)
  ansible.builtin.copy:
    src: defaults-debian.conf
    dest: /etc/default/suricata
    owner: root
    group: root
    mode: "0644"
  notify:
    - Restart suricata

- name: Ensure suricata iprep directory exists
  ansible.builtin.file:
    path: "{{ suricata_iprep_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy iprep categories.txt
  ansible.builtin.copy:
    src: categories.txt
    dest: "{{ suricata_iprep_dir }}/categories.txt"
    owner: root
    group: root
    mode: "0644"

- name: Deploy suricata EVE logrotate config
  ansible.builtin.copy:
    src: suricata-eve.conf
    dest: /etc/logrotate.d/suricata-eve
    owner: root
    group: root
    mode: "0644"

- name: Ensure suricata is enabled and running
  ansible.builtin.systemd:
    name: suricata
    state: started
    enabled: true

- name: Configure suricata-update cron
  ansible.builtin.cron:
    name: "suricata-update"
    hour: "{{ suricata_update_cron_hour }}"
    minute: "{{ suricata_update_cron_minute }}"
    job: "/usr/bin/suricata-update && /usr/bin/systemctl restart suricata"
    user: root

# ---------- IP Reputation feeds ----------

- name: Deploy iprep update script
  ansible.builtin.copy:
    src: suricata-iprep-update.sh
    dest: "{{ iprep_update_script }}"
    owner: root
    group: root
    mode: "0755"

- name: Configure iprep update cron
  ansible.builtin.cron:
    name: "suricata-iprep-update"
    hour: "{{ iprep_cron_hours }}"
    minute: "15"
    job: "{{ iprep_update_script }}"
    user: root

# ---------- MISP integration ----------

- name: Deploy MISP pull rules script
  ansible.builtin.template:
    src: misp-pull-rules.sh.j2
    dest: "{{ misp_pull_script }}"
    owner: root
    group: root
    mode: "0755"

- name: Deploy MISP push sightings script
  ansible.builtin.template:
    src: misp-push-sightings.py.j2
    dest: "{{ misp_push_script }}"
    owner: root
    group: root
    mode: "0755"

- name: Configure MISP pull cron
  ansible.builtin.cron:
    name: "misp-pull-rules"
    hour: "{{ misp_pull_cron_hours }}"
    minute: "0"
    job: "{{ misp_pull_script }}"
    user: root

- name: Configure MISP push sightings cron
  ansible.builtin.cron:
    name: "misp-push-sightings"
    hour: "{{ misp_pull_cron_hours }}"
    minute: "{{ misp_push_cron_minute }}"
    job: "{{ misp_push_script }}"
    user: root

# ---------- GeoIP weekly update ----------

- name: Deploy GeoIP weekly update cron
  ansible.builtin.copy:
    dest: /etc/cron.d/geoipupdate
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (roles/suricata/tasks/main.yml)
      # Update MaxMind GeoLite2 databases weekly (Wednesdays 06:30, after soc-wake 06:00)
      # MaxMind releases updates on Tuesdays
      30 6 * * 3 root /usr/bin/geoipupdate && systemctl restart suricata evebox

# ---------- WAN IP updater ----------

- name: Deploy WAN IP update script
  ansible.builtin.template:
    src: update-wan-ip.sh.j2
    dest: "{{ wan_ip_script }}"
    owner: root
    group: root
    mode: "0755"

- name: Configure WAN IP update cron
  ansible.builtin.cron:
    name: "update-wan-ip"
    minute: "*/5"
    job: "{{ wan_ip_script }}"
    user: root

# ---------- Snort 3 ----------

- name: Deploy snort.lua config
  ansible.builtin.template:
    src: snort.lua.j2
    dest: "{{ snort_config }}"
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify:
    - Restart snort3

- name: Deploy snort3 logrotate config
  ansible.builtin.copy:
    src: snort3
    dest: /etc/logrotate.d/snort3
    owner: root
    group: root
    mode: "0644"

- name: Deploy snort3 systemd unit
  ansible.builtin.copy:
    src: snort3.service
    dest: /etc/systemd/system/snort3.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Daemon reload
    - Restart snort3

- name: Deploy snort3 rules update script
  ansible.builtin.template:
    src: snort3-update-rules.sh.j2
    dest: "{{ snort_update_script }}"
    owner: root
    group: root
    mode: "0755"

- name: Ensure snort3 is enabled and running
  ansible.builtin.systemd:
    name: snort3
    state: started
    enabled: true

# ---------- fail2ban ----------

- name: Deploy fail2ban suricata jail config
  ansible.builtin.template:
    src: suricata-jail.conf.j2
    dest: /etc/fail2ban/jail.d/suricata.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Restart fail2ban

- name: Deploy fail2ban suricata EVE filter
  ansible.builtin.copy:
    src: suricata-eve.conf
    dest: /etc/fail2ban/filter.d/suricata-eve.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Restart fail2ban

- name: Deploy fail2ban OpenWrt BanIP action
  ansible.builtin.template:
    src: openwrt-banip.conf.j2
    dest: /etc/fail2ban/action.d/openwrt-banip.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Restart fail2ban

- name: Ensure fail2ban is enabled and running
  ansible.builtin.systemd:
    name: fail2ban
    state: started
    enabled: true

# ---------- Filebeat ----------

- name: Deploy filebeat.yml
  ansible.builtin.template:
    src: filebeat.yml.j2
    dest: "{{ filebeat_config }}"
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify:
    - Restart filebeat

- name: Ensure filebeat is enabled and running
  ansible.builtin.systemd:
    name: filebeat
    state: started
    enabled: true

# ---------- Arkime (on-demand) ----------
# Arkime runs ON DEMAND, not continuously: 24/7 full-packet capture filled /opt
# and the value is concentrated in active investigations. The `arkime-capture`
# helper starts/stops capture + viewer for a window. snapLen=65536 (config.ini)
# handles the virtio SPAN NIC's fixed hardware GRO. See [[arkime]] / soc-lab docs.

- name: Deploy Arkime config.ini
  ansible.builtin.template:
    src: config.ini.j2
    dest: "{{ arkime_config }}"
    owner: root
    group: root
    mode: "0640"
    backup: true

- name: Deploy arkime-capture on-demand helper
  ansible.builtin.copy:
    src: arkime-capture
    dest: /usr/local/bin/arkime-capture
    owner: root
    group: root
    mode: "0755"

# enabled:false only — no state, so a converge never stops a capture you started.
- name: Ensure Arkime services do not start at boot (on-demand)
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
  loop:
    - arkimecapture
    - arkimeviewer

# ---------- Velociraptor ----------

- name: Deploy Velociraptor server config
  ansible.builtin.copy:
    src: server.config.yaml
    dest: "{{ velociraptor_config }}"
    force: false  # DR-seed only: VR config is rotated out-of-band on the host; never clobber live
    owner: root
    group: root
    mode: "0600"
  notify:
    - Restart velociraptor

- name: Ensure velociraptor is enabled and running
  ansible.builtin.systemd:
    name: velociraptor
    state: started
    enabled: true
- name: Velociraptor | set admin password
  ansible.builtin.command:
    cmd: >-
      velociraptor --config /etc/velociraptor/server.config.yaml
      user add --role administrator admin {{ vault_velociraptor_admin_password }}
  changed_when: false
  no_log: true
  tags: velociraptor

- name: Velociraptor | ensure iptables and netfilter-persistent installed
  ansible.builtin.apt:
    name:
      - iptables
      - netfilter-persistent
    state: present
  tags: velociraptor

- name: Velociraptor | allow dashboard from .13
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: 8889
    source: 192.168.1.13/32
    jump: ACCEPT
    comment: velociraptor-allow-13
  notify: Velociraptor | save iptables rules
  tags: velociraptor

- name: Velociraptor | block dashboard from other hosts
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: 8889
    jump: DROP
    comment: velociraptor-block-others
  notify: Velociraptor | save iptables rules
  tags: velociraptor


- name: Velociraptor | check automation API config exists
  ansible.builtin.stat:
    path: /etc/velociraptor/automation_api.yaml
  register: vr_api_config
  tags: velociraptor

- name: Velociraptor | generate automation API client config
  ansible.builtin.command:
    cmd: >-
      velociraptor --config /etc/velociraptor/server.config.yaml
      config api_client --name automation --role administrator
      /etc/velociraptor/automation_api.yaml
  when: not vr_api_config.stat.exists
  changed_when: true
  tags: velociraptor

- name: Velociraptor | secure automation API config permissions
  ansible.builtin.file:
    path: /etc/velociraptor/automation_api.yaml
    owner: root
    group: root
    mode: "0600"
  tags: velociraptor

- name: Velociraptor | ensure TrackProcesses in client monitoring
  ansible.builtin.script:
    cmd: /opt/soc-ansible/roles/suricata/files/vr-ensure-trackprocesses.py
  register: track_result
  changed_when: "'changed' in track_result.stdout"
  notify: Restart velociraptor
  tags: velociraptor

- name: Velociraptor | schedule NetstatEnriched on .13 (15 min)
  ansible.builtin.cron:
    name: velociraptor-netstat-win
    minute: "*/15"
    job: velociraptor --api_config /etc/velociraptor/automation_api.yaml query 'SELECT collect_client(client_id="C.ac8c5eec63123b59", artifacts=["Windows.Network.NetstatEnriched"], timeout=1200) FROM scope()' >/dev/null 2>&1
  tags: velociraptor

- name: Velociraptor | schedule ScheduledTasks on .13 (30 min)
  ansible.builtin.cron:
    name: velociraptor-scheduledtasks-win
    minute: "*/30"
    job: velociraptor --api_config /etc/velociraptor/automation_api.yaml query 'SELECT collect_client(client_id="C.ac8c5eec63123b59", artifacts=["Windows.System.ScheduledTasks"], timeout=1200) FROM scope()' >/dev/null 2>&1
  tags: velociraptor

- name: Velociraptor | schedule Services on .13 (30 min)
  ansible.builtin.cron:
    name: velociraptor-services-win
    minute: "1-59/30"
    job: velociraptor --api_config /etc/velociraptor/automation_api.yaml query 'SELECT collect_client(client_id="C.ac8c5eec63123b59", artifacts=["Windows.System.Services"], timeout=1200) FROM scope()' >/dev/null 2>&1
  tags: velociraptor

- name: Velociraptor | schedule WMI persistence on .13 (30 min)
  ansible.builtin.cron:
    name: velociraptor-wmi-win
    minute: "2-59/30"
    job: velociraptor --api_config /etc/velociraptor/automation_api.yaml query 'SELECT collect_client(client_id="C.ac8c5eec63123b59", artifacts=["Windows.Persistence.PermanentWMIEvents"], timeout=1200) FROM scope()' >/dev/null 2>&1
  tags: velociraptor

- name: Velociraptor | schedule StartupItems on .13 (30 min)
  ansible.builtin.cron:
    name: velociraptor-startup-win
    minute: "3-59/30"
    job: velociraptor --api_config /etc/velociraptor/automation_api.yaml query 'SELECT collect_client(client_id="C.ac8c5eec63123b59", artifacts=["Windows.Sys.StartupItems"], timeout=1200) FROM scope()' >/dev/null 2>&1
  tags: velociraptor

- name: Velociraptor | schedule Pslist on .120 (15 min)
  ansible.builtin.cron:
    name: velociraptor-pslist-lin
    minute: "*/15"
    job: velociraptor --api_config /etc/velociraptor/automation_api.yaml query 'SELECT collect_client(client_id="C.7ce12e4c591be619", artifacts=["Linux.Sys.Pslist"], timeout=1200) FROM scope()' >/dev/null 2>&1
  tags: velociraptor

- name: Velociraptor | schedule Netstat on .120 (15 min)
  ansible.builtin.cron:
    name: velociraptor-netstat-lin
    minute: "*/15"
    job: velociraptor --api_config /etc/velociraptor/automation_api.yaml query 'SELECT collect_client(client_id="C.7ce12e4c591be619", artifacts=["Linux.Network.Netstat"], timeout=1200) FROM scope()' >/dev/null 2>&1
  tags: velociraptor

- name: Velociraptor | schedule Services on .120 (30 min)
  ansible.builtin.cron:
    name: velociraptor-services-lin
    minute: "4-59/30"
    job: velociraptor --api_config /etc/velociraptor/automation_api.yaml query 'SELECT collect_client(client_id="C.7ce12e4c591be619", artifacts=["Linux.Sys.Services"], timeout=1200) FROM scope()' >/dev/null 2>&1
  tags: velociraptor

