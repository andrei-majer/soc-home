---
disk_alert_threshold: 85
disk_alert_script: /usr/local/bin/disk-alert.sh
disk_alert_log: /var/log/disk-alert.log
ssh_authorized_keys:
  - "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"
common_timezone: "{{ ntp_timezone | default('Europe/Bucharest') }}"

# journald disk cap (added 2026-05-30 after disk-full outage on .21)
journald_max_use: 200M
journald_keep_free: 1G

# disk-alert notification + self-remediation (added 2026-05-30)
# Notification moved to Telegram 2026-06-29 — disk-alert.sh.j2 reads the bot creds
# directly, so the old disk_alert_ntfy_topic var was dropped 2026-08-01 (unreferenced).
disk_alert_critical: 92
disk_alert_journal_floor: 100M
