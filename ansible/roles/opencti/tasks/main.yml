---
# ============================================================================
# OpenCTI role — Docker Compose stack, connectors, backup (host .135)
# ============================================================================

- name: Ensure OpenCTI install dir exists
  ansible.builtin.file:
    path: "{{ opencti_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Ensure OpenCTI config dir exists
  ansible.builtin.file:
    path: "{{ opencti_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Ensure OpenCTI backups dir exists
  ansible.builtin.file:
    path: "{{ opencti_backups_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ opencti_install_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: '0644'
    backup: true
  notify: Restart opencti

- name: Deploy .env
  ansible.builtin.template:
    src: env.j2
    dest: "{{ opencti_install_dir }}/.env"
    owner: root
    group: root
    mode: '0600'
    backup: true
  notify: Restart opencti

- name: Deploy malwarebazaar connector config
  ansible.builtin.template:
    src: malwarebazaar.yml.j2
    dest: "{{ opencti_config_dir }}/malwarebazaar.yml"
    owner: root
    group: root
    mode: '0600'
    backup: true
  notify: Restart opencti

- name: Deploy opencti systemd unit
  ansible.builtin.copy:
    src: opencti.service
    dest: /etc/systemd/system/opencti.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd daemon
    - Restart opencti

# OpenCTI backups are handled by the `backups` role: secret-free, local
# /usr/local/sbin/opencti-backup.sh + a monthly cron. The former in-role
# backup.sh.j2 hardcoded a plaintext SFTP password and still targeted the
# pre-migration Windows .15 host, so it was removed and consolidated here.
# The absent-tasks below purge the legacy script/cron from any host that
# still carries them from an earlier converge.

- name: Remove legacy OpenCTI backup script (had hardcoded SFTP credentials)
  ansible.builtin.file:
    path: /opt/opencti/backup.sh
    state: absent

- name: Remove legacy OpenCTI backup cron
  ansible.builtin.file:
    path: /etc/cron.d/opencti-backup
    state: absent

- name: Ensure opencti service is enabled and running
  ansible.builtin.systemd:
    name: opencti
    state: started
    enabled: true
