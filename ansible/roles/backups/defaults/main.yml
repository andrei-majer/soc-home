---
# soc-ansible/roles/backups/defaults/main.yml
backup_base_dir: /backup
backup_retention_days: 180
backup_log_dir: /var/log

# Monthly schedule: 1st of every month at 02:00 local (OpenCTI at 03:00)
backup_cron_minute: 0
backup_cron_hour: 2
backup_cron_day: "1"
backup_opencti_cron_hour: 3

# Per-service flags (overridden in host_vars when host owns the data)
backup_enable_misp: false
backup_enable_opencti: false
backup_enable_wazuh: false
backup_enable_kibana: false
backup_enable_velociraptor: false
backup_enable_grafana: false
backup_enable_evebox: false
