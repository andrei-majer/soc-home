---
# ============================================================================
# ELK role - manages Elasticsearch, Kibana, Logstash, Filebeat, and index
# cleanup on the .133 host.
# ============================================================================

# ---------- Elasticsearch ----------

- name: Deploy elasticsearch.yml
  ansible.builtin.template:
    src: elasticsearch.yml.j2
    dest: "{{ es_config }}"
    owner: root
    group: elasticsearch
    mode: "0640"
    backup: true
  notify:
    - Restart elasticsearch

- name: Deploy ES JVM GC log options
  ansible.builtin.copy:
    content: |
      # Managed by Ansible — GC log rotation overrides
      -Xlog:gc*,gc+age=trace,safepoint:file=gc.log:utctime,level,pid,tags:filecount={{ es_gc_log_count }},filesize={{ es_gc_log_size }}
    dest: /etc/elasticsearch/jvm.options.d/gc-log.options
    owner: root
    group: elasticsearch
    mode: "0640"
  notify:
    - Restart elasticsearch

- name: Deploy ES logrotate config
  ansible.builtin.copy:
    src: elasticsearch-soc
    dest: /etc/logrotate.d/elasticsearch-soc
    owner: root
    group: root
    mode: "0644"

- name: Ensure elasticsearch is enabled and running
  ansible.builtin.systemd:
    name: elasticsearch
    state: started
    enabled: true

# ---------- Kibana ----------

- name: Deploy kibana.yml
  ansible.builtin.template:
    src: kibana.yml.j2
    dest: "{{ kibana_config }}"
    owner: root
    group: kibana
    mode: "0640"
    backup: true
  notify:
    - Restart kibana

- name: Ensure kibana is enabled and running
  ansible.builtin.systemd:
    name: kibana
    state: started
    enabled: true

# ---------- Logstash ----------

- name: Deploy Logstash suricata.conf
  ansible.builtin.template:
    src: suricata.conf.j2
    dest: "{{ logstash_config }}"
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify:
    - Restart logstash

- name: Deploy Logstash logrotate config
  ansible.builtin.copy:
    src: logstash-soc
    dest: /etc/logrotate.d/logstash-soc
    owner: root
    group: root
    mode: "0644"

- name: Ensure logstash is enabled and running
  ansible.builtin.systemd:
    name: logstash
    state: started
    enabled: true

# ---------- Filebeat (Wazuh module) ----------

- name: Deploy filebeat.yml
  ansible.builtin.template:
    src: filebeat.yml.j2
    dest: "{{ elk_filebeat_config }}"
    owner: root
    group: root
    mode: "0600"
    backup: true
  notify:
    - Restart filebeat

- name: Ensure filebeat is enabled and running
  ansible.builtin.systemd:
    name: filebeat
    state: started
    enabled: true

# ---------- Index cleanup ----------

- name: Deploy elk-cleanup.py
  ansible.builtin.template:
    src: elk-cleanup.py.j2
    dest: "{{ elk_cleanup_script }}"
    owner: root
    group: root
    mode: "0755"

- name: Configure elk-cleanup cron
  ansible.builtin.cron:
    name: "elk-cleanup"
    hour: "{{ elk_cleanup_cron_hour }}"
    minute: "{{ elk_cleanup_cron_minute }}"
    job: "/usr/bin/python3 {{ elk_cleanup_script }} >> /var/log/elk-cleanup.log 2>&1"
    user: root

- name: Deploy elk-disk-reclaim.sh (runs before elk-cleanup, ES-independent)
  ansible.builtin.template:
    src: elk-disk-reclaim.sh.j2
    dest: "{{ elk_reclaim_script }}"
    mode: "0755"
    owner: root
    group: root

- name: Configure elk-disk-reclaim cron
  ansible.builtin.cron:
    name: "elk-disk-reclaim"
    hour: "{{ elk_reclaim_cron_hour }}"
    minute: "{{ elk_reclaim_cron_minute }}"
    job: "{{ elk_reclaim_script }} >> /var/log/elk-disk-reclaim.log 2>&1"
    user: root

# Superseded by elk-cleanup.py (wazuh-archives index retention) and by the
# archive prune in elk-disk-reclaim.sh. Both ran at 03:15/03:30 — inside the
# .15 power-off window — so neither ever fired.
- name: Remove superseded out-of-band archive cleanup jobs
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/cron.d/wazuh-archives-cleanup
    - /etc/cron.d/wazuh-ossec-archives-cleanup
    - /usr/local/bin/wazuh-archives-cleanup.sh

- name: Deploy Logstash zeek.conf
  ansible.builtin.template:
    src: zeek.conf.j2
    dest: /etc/logstash/conf.d/zeek.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify:
    - Restart logstash
