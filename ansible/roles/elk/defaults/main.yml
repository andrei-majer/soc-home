---
# Elasticsearch
es_config: /etc/elasticsearch/elasticsearch.yml
es_cluster_name: suricata-elk
es_gc_log_count: 5
es_gc_log_size: "20m"

# Kibana
kibana_config: /etc/kibana/kibana.yml
kibana_version: "8.19.12"

# Logstash
logstash_config: /etc/logstash/conf.d/suricata.conf
logstash_geoip_plugin_version: "8.0.0"

# Filebeat (on .133 for Wazuh)
elk_filebeat_config: /etc/filebeat/filebeat.yml

# Index cleanup
elk_cleanup_script: /usr/local/bin/elk-cleanup.py
# .15 powers these VMs down 23:00-06:00, so anything scheduled overnight never
# runs (retention silently stalled 2026-06-30..2026-07-31). Keep inside the
# awake window: reclaim first, then the ES index deletes.
elk_cleanup_cron_hour: "6"
elk_cleanup_cron_minute: "30"
elk_reclaim_cron_hour: "6"
elk_reclaim_cron_minute: "25"
# flat Wazuh archive files on disk (separate from the ES index retention above)
retention_ossec_archives: 7
retention_suricata: 14
retention_wazuh_archives: 7
retention_wazuh_alerts: 14
retention_wazuh_suricata: 14
retention_arkime: 14
retention_monitoring: 3
retention_wazuh_monitoring: 28
retention_wazuh_statistics: 56

# disk reclaim that runs before elk-cleanup.py (works when ES is down) — 2026-05-30
elk_reclaim_script: /usr/local/bin/elk-disk-reclaim.sh
elk_reclaim_journal_size: 200M
retention_zeek: 14
