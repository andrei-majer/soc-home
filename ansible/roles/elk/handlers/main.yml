---
- name: Restart elasticsearch
  ansible.builtin.systemd:
    name: elasticsearch
    state: restarted

- name: Restart kibana
  ansible.builtin.systemd:
    name: kibana
    state: restarted

- name: Restart logstash
  ansible.builtin.systemd:
    name: logstash
    state: restarted

- name: Restart filebeat
  ansible.builtin.systemd:
    name: filebeat
    state: restarted
