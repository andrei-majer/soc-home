# Dedicated PXE proxyDHCP + TFTP for .15 netboot. NEVER a real DHCP server.
port=0
interface=eno1
bind-interfaces
log-dhcp

# proxyDHCP on the LAN subnet: answer PXE only, assign NO addresses.
dhcp-range=192.168.1.0,proxy

# TFTP
enable-tftp
tftp-root=/srv/tftp

# UEFI x86-64 clients (client-arch 7 and 9) -> top-level shim
dhcp-match=set:efi-x64,option:client-arch,7
dhcp-match=set:efi-x64,option:client-arch,9
pxe-service=tag:efi-x64, x86-64_EFI, "UEFI Netboot (.15)", bootx64.efi
dhcp-boot=tag:efi-x64, bootx64.efi
