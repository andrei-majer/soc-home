set timeout=30
set default=0
set gfxpayload=text

# Clonezilla is Debian end-to-end, so it boots with Secure Boot ON:
# shim -> this Debian grub -> Debian-signed kernel all verify. (Validated 2026-07-07
# via QEMU+OVMF with Microsoft keys enrolled.) No ip=dhcp — Debian live-boot
# auto-configures the network from fetch=, and an explicit ip=dhcp breaks it.
menuentry "Clonezilla Live — disk imaging (.15) [Secure Boot OK]" {
    linux (tftp)/clonezilla/vmlinuz boot=live components noswap noprompt nomodeset edd=on \
      username=user config keyboard-layouts=us locales=en_US.UTF-8 \
      fetch=http://192.168.1.15:8088/clonezilla/filesystem.squashfs \
      ocs_live_run="ocs-live-general" ocs_live_extra_param="" ocs_daemonon="ssh"
    initrd (tftp)/clonezilla/initrd.img
}

# Ubuntu and Fedora are DIRECT-booted from this (Debian) grub and require Secure
# Boot OFF on the target. Two reasons chainloading their signed shims does NOT work:
#   1. A Debian grub cannot verify a Canonical/Red Hat kernel under Secure Boot.
#   2. A chainloaded distro shim cannot locate its own grub over TFTP ("Failed to
#      find fs: Unsupported") — a shim must be the FIRST network bootloader.
# So the target's firmware must have Secure Boot disabled for these two entries.
# (Both validated 2026-07-07 via QEMU+OVMF: kernel load + DHCP + HTTP fetch.)
# NOTE: Ubuntu's url= downloads the ENTIRE ISO into RAM — the target needs >= ~8 GB.
menuentry "Ubuntu Server 24.04 — installer (.15) [Secure Boot OFF]" {
    linux (tftp)/ubuntu-server/vmlinuz ip=dhcp url=http://192.168.1.15:8088/ubuntu-server/ubuntu-24.04.4-live-server-amd64.iso ---
    initrd (tftp)/ubuntu-server/initrd
}

menuentry "Fedora 44 — netinstall (.15) [Secure Boot OFF]" {
    linux (tftp)/fedora44/vmlinuz ip=dhcp inst.repo=http://192.168.1.15:8088/fedora44/ inst.stage2=http://192.168.1.15:8088/fedora44/
    initrd (tftp)/fedora44/initrd.img
}

menuentry "Local disk (boot normally)" {
    exit
}
