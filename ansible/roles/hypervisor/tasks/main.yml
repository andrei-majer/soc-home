---
# ============================================================================
# Hypervisor role — .15 host-stack units that are NOT provided by any VM role.
#
# The .15 host was historically runbook-only (see docs/runbooks/hypervisor-15.md);
# this role begins bringing that host stack under Ansible so a reinstall no longer
# silently loses it (as happened with the ups-loki collector on 2026-07-02).
#
# Scope (first pass, 2026-07-06): Docker storage guardrails only.
#   - docker-prune : weekly prune of unused images/cache/stopped containers >7d
#   - disk-alert   : hourly Telegram alert when / or /mnt/vms crosses 85%
# Added 2026-07-16: soc-sleep/wake (nightly SOC VM ACPI shutdown/cold-boot).
# Added 2026-07-27: ups-loki (UPS reading -> Loki push, every 30s).
# Idempotent — these are already deployed on .15; this just codifies them.
#
# Added 2026-08-23: soc-vm-shutdown, soc-vm-boot, soc-vm-watchdog, SPAN-NIC netplan,
# and the full NUT/UPS power-loss chain (configs, ups-resilience, sudoers) — the last of
# which is templated from vault for the two files holding the monuser password.
#
# Deliberately NOT managed here: the runtime /etc/nut/ARMED toggle — that is the
# operator's arm/disarm switch and Ansible must never assert it either way.
# Future passes: ssd-smart-loki, lm-sensors.
# ============================================================================

- name: Install .15 host guardrail scripts
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/sbin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - docker-prune.sh
    - disk-alert.sh

- name: Install docker guardrail systemd units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - docker-prune.service
    - docker-prune.timer
    - disk-alert.service
    - disk-alert.timer
  notify: Reload systemd

- name: Enable and start docker guardrail timers
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - docker-prune.timer
    - disk-alert.timer

# ---------- soc-sleep/wake: nightly SOC VM ACPI shutdown/cold-boot ----------
# Suricata excluded from SOC_VMS in both scripts 2026-07-16: it now hosts
# Grafana (grafana-proxy container, see roles/hypervisor or memory soc-lab/
# tailscale.md), reached over Tailscale from mobile, so it stays up 24/7.
- name: Install soc-sleep/wake scripts
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - soc-sleep.sh
    - soc-wake.sh

- name: Install soc-sleep/wake systemd units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - soc-sleep.service
    - soc-sleep.timer
    - soc-wake.service
    - soc-wake.timer
  notify: Reload systemd

- name: Enable and start soc-sleep/wake timers
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - soc-sleep.timer
    - soc-wake.timer

# ---------- soc-vm-shutdown: clean guest stop on host reboot/poweroff ----------
# 2026-08-23: an operator reboot of .15 left every guest in VBox state `aborted` —
# systemd killed the VBoxHeadless processes with no ACPI shutdown, i.e. the equivalent
# of yanking their power. ELK's Elasticsearch and T-Pot's 24 containers both recovered
# that time, but taking that risk on every reboot is not worth it.
#
# Ordered After=vboxdrv.service so systemd stops it BEFORE vboxdrv on the way down; the
# unit does nothing on start and exists purely for its ExecStop.
#
# Not using VirtualBox's own SHUTDOWN_USERS/SHUTDOWN=acpibutton hook in
# /etc/default/virtualbox: stop_vms() in vboxdrv.sh waits a hardcoded 30s before
# unloading the module, far too short for ELK or T-Pot Hive.
- name: Install soc-vm-shutdown script
  ansible.builtin.copy:
    src: soc-vm-shutdown.sh
    dest: /usr/local/bin/soc-vm-shutdown.sh
    owner: root
    group: root
    mode: "0755"

- name: Install soc-vm-shutdown unit
  ansible.builtin.copy:
    src: soc-vm-shutdown.service
    dest: /etc/systemd/system/soc-vm-shutdown.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

# when: guard is load-bearing. In --check the copy above does not actually write the unit
# file, so systemd cannot find it and the task fails — which aborts the play and hides
# every remaining hunk. That matters here because soc-ansible-state.sh runs a --check
# drift scan every 4h; without this guard a rebuilt host would fail that scan forever.
- name: Enable and start soc-vm-shutdown (ExecStart is /bin/true — arms the ExecStop)
  ansible.builtin.systemd:
    name: soc-vm-shutdown.service
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode

# ---------- soc-vm-boot: replaces VirtualBox's vboxautostart ----------
# vboxautostart is FAIL-FAST — a single per-VM error aborts the whole run, and it still
# exits 0 so nothing reports it. It broke two boots on 2026-08-23 for unrelated reasons:
# first the E_ACCESSDENIED enumeration failure (VMs archived on the late-unlocking
# /mnt/cold), then "already locked by a session" on Suricata — started microseconds earlier
# by suricata-vm-start.service — which made it abandon OpenCanary and ELK while both were
# down and flagged. Proven by hand: with Suricata up and the other two stopped,
# VBoxAutostart started neither.
#
# soc-vm-boot.sh starts each VM independently, so one failure never blocks the rest, and
# logs every outcome to the journal. It is also schedule-aware, which fixes the separate
# "a mid-day reboot leaves T-Pot Hive down" gap: vboxautostart never started Hive (flag off)
# and soc-wake had already run for the day, so nothing did.
- name: Install SOC VM boot start-up script
  ansible.builtin.copy:
    src: soc-vm-boot.sh
    dest: /usr/local/bin/soc-vm-boot.sh
    owner: root
    group: root
    mode: "0755"

- name: Install soc-vm-boot unit
  ansible.builtin.copy:
    src: soc-vm-boot.service
    dest: /etc/systemd/system/soc-vm-boot.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Enable soc-vm-boot (do NOT start — the fleet is already up)
  ansible.builtin.systemd:
    name: soc-vm-boot.service
    enabled: true
    daemon_reload: true
  when: not ansible_check_mode

# Retire the two mechanisms soc-vm-boot replaces. enabled:false ONLY — deliberately no
# state:stopped, because stopping suricata-vm-start.service runs its ExecStop, which ACPI
# shuts down the running Suricata VM. Disabling only affects the next boot, which is what
# we want.
- name: Disable vboxautostart-service (superseded by soc-vm-boot; fail-fast by design)
  ansible.builtin.systemd:
    name: vboxautostart-service.service
    enabled: false
  when: not ansible_check_mode

# ---------- vboxautostart: mount ordering (now vestigial) ----------
# vboxautostart-service is DISABLED as of 2026-08-23 (see soc-vm-boot above), so this
# drop-in no longer runs. It is kept, and kept correct, because it is the thing that makes
# vboxautostart safe if anyone ever re-enables it.
#
# The bug it addresses: VBoxSVC caches each machine's accessibility ONCE, at startup. Two
# VMs were archived onto /mnt/cold, a LUKS volume that unlocks late in boot. When VBoxSVC
# started first they were inaccessible to it for the life of that process, VBoxAutostart's
# enumeration of ALL machines died with E_ACCESSDENIED (component MachineWrap, interface
# IMachine), and it started nothing while still exiting 0. Measured on the 10:10 boot:
# cryptcold began at 10:10:01, VBoxSVC spawned 10:10:06, /mnt/cold mounted 10:10:08.
#
# An earlier theory — that VBoxAutostart raced its own VBoxSVC spawn — was WRONG; see the
# header of vboxautostart-warmup.sh, which documents it so nobody re-treads it.
#
# Those two VMs have since been unregistered, so this is now belt-and-braces on top of
# belt-and-braces.
- name: Install vboxautostart warm-up script
  ansible.builtin.copy:
    src: vboxautostart-warmup.sh
    dest: /usr/local/bin/vboxautostart-warmup.sh
    owner: root
    group: root
    mode: "0755"

- name: Ensure vboxautostart drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/vboxautostart-service.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install vboxautostart warm-up drop-in
  ansible.builtin.copy:
    src: vboxautostart-warmup.conf
    dest: /etc/systemd/system/vboxautostart-service.service.d/10-warmup.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

# ---------- SPAN NIC: keep enp4s0 address-less ----------
# enp4s0 carries the switch's SPAN mirror and is bridged into the Suricata VM in
# promiscuous mode, so anything the HOST transmits on it is injected into the very
# traffic the sensor is monitoring. The pre-reinstall /etc/netplan/99-static-ip.yaml
# pinned this down but did not survive the 2026-07-02 reinstall — by 2026-08-23 enp4s0
# was accepting router advertisements, holding two global IPv6 addresses, and had put
# ~306 packets onto the mirror.
#
# Deliberately no `netplan apply` handler: applying is an operator step, so a mistake
# here cannot take .15 off the LAN unattended. The file otherwise takes effect at the
# next reboot.
- name: Install netplan drop-in keeping the SPAN NIC address-less
  ansible.builtin.copy:
    src: 99-span-nic.yaml
    dest: /etc/netplan/99-span-nic.yaml
    owner: root
    group: root
    mode: "0600"

# ---------- ups-loki: push UPS readings to Loki every 30s ----------
# 2026-07-27: this was the "future pass" flagged in the role header above. Root-caused
# the same day — the script still pointed at the pre-renumber 192.168.1.120 Loki address
# (2026-07-15 renumber moved Grafana/Loki to .20), so the UPS Grafana panels went dark
# with the collector silently failing every 30s (curl error swallowed by `|| true`).
# Fixed live by hand first, now codified so a reinstall doesn't reintroduce the stale IP.
- name: Install ups-loki collector script
  ansible.builtin.copy:
    src: ups-loki-push.sh
    dest: /usr/local/bin/ups-loki-push.sh
    owner: root
    group: root
    mode: "0755"

- name: Install ups-loki systemd units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - ups-loki.service
    - ups-loki.timer
  notify: Reload systemd

- name: Enable and start ups-loki timer
  ansible.builtin.systemd:
    name: ups-loki.timer
    enabled: true
    state: started
    daemon_reload: true

# ---------- NIC: e1000e "Detected Hardware Unit Hang" mitigation ----------
# 2026-07-06: eno1 (Intel I219-V) hung 829x, dropping .15 off the LAN while the
# OS ran fine (WoL useless — NIC was the dead part). Disabling TSO/GSO/GRO is the
# documented workaround for this I219/e1000e TX-offload bug.
- name: Ensure ethtool is installed
  ansible.builtin.apt:
    name: ethtool
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install eno1 offload-disable unit
  ansible.builtin.copy:
    src: eno1-disable-offload.service
    dest: /etc/systemd/system/eno1-disable-offload.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Enable and start eno1 offload-disable
  ansible.builtin.systemd:
    name: eno1-disable-offload.service
    enabled: true
    state: started
    daemon_reload: true

- name: Set GRUB kernel cmdline (pcie_aspm=off — e1000e NIC hang belt-and-suspenders)
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^GRUB_CMDLINE_LINUX_DEFAULT='
    line: 'GRUB_CMDLINE_LINUX_DEFAULT="{{ hypervisor_grub_cmdline_default }}"'
    backup: true
  notify: Update grub

# ---------- Suricata VM: boot-start + watchdog ----------
# 2026-07-29: after a RAM-upgrade reboot, Suricata stayed down until noticed
# manually. soc-wake.timer excludes it (kept up 24/7 for the Grafana mobile
# proxy), and no VBox autostart was configured, so nothing brought it back.
# Two defenses:
#   1. suricata-vm-start.service — cold-starts the VM on host boot (User=andrei,
#      polls /dev/vboxdrv up to 60s to survive the vboxdrv-udev race that
#      already bit soc-wake.sh, KillMode=process so VBoxHeadless survives the
#      oneshot exit).
#   2. soc-vm-watchdog.sh — andrei crontab */5 min (see below; superseded
#      suricata-watchdog.sh on 2026-08-23).
# Coverage gap (deliberate): neither catches "SPAN NIC carrier lost".
- name: Install Suricata VM boot-start unit
  ansible.builtin.copy:
    src: suricata-vm-start.service
    dest: /etc/systemd/system/suricata-vm-start.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

# DISABLED 2026-08-23: superseded by soc-vm-boot.service, which starts Suricata along with
# the rest of the fleet. Keeping both enabled is actively harmful — this unit started
# Suricata in the same second as vboxautostart, and the resulting "already locked by a
# session" made vboxautostart abandon OpenCanary and ELK. The unit file is left installed so
# it can be re-enabled by hand if soc-vm-boot ever needs to be backed out.
# enabled:false ONLY — state:stopped would run its ExecStop and ACPI-shutdown a live Suricata.
- name: Disable Suricata VM boot-start (superseded by soc-vm-boot)
  ansible.builtin.systemd:
    name: suricata-vm-start.service
    enabled: false
    daemon_reload: true

- name: Ensure /home/andrei/suricata directory exists
  ansible.builtin.file:
    path: /home/andrei/suricata
    state: directory
    owner: andrei
    group: andrei
    mode: "0755"

# ---------- soc-vm-watchdog: watch the whole fleet, not just Suricata ----------
# 2026-08-23: two consecutive reboots of .15 came back with ELK and OpenCanary down — no
# SIEM ingest, no canary — and nothing reported it (vboxautostart raced its own VBoxSVC,
# started nothing, exited 0). suricata-watchdog.sh stayed silent throughout because
# suricata-vm-start.service had correctly brought up the one VM it watched.
#
# The replacement checks every VM that is supposed to be running, and adds a TCP probe of
# each guest's key service port from .15 over the LAN — which finally closes the old "VM up
# but the guest is dead" gap without needing SSH from .15 to the guests.
#
# Schedule-aware: ELK / T-Pot Hive / OpenCanary follow the soc-sleep/soc-wake cycle and are
# only expected inside a 06:15-22:45 window, so the nightly ACPI shutdown never pages.
# Also stays quiet for 10 min after a host boot while the fleet comes up.
#
# Telegram creds come from ~/teslamate/.telegram.env, which uses TG_TOKEN / TG_CHAT — NOT
# TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID as the generic naming would suggest.
- name: Ensure /home/andrei/soc-watchdog directory exists
  ansible.builtin.file:
    path: /home/andrei/soc-watchdog
    state: directory
    owner: andrei
    group: andrei
    mode: "0755"

- name: Install SOC VM fleet watchdog script
  ansible.builtin.copy:
    src: soc-vm-watchdog.sh
    dest: /home/andrei/soc-watchdog/soc-vm-watchdog.sh
    owner: andrei
    group: andrei
    mode: "0755"

- name: Install andrei cron entry for the SOC VM fleet watchdog (every 5 min)
  ansible.builtin.cron:
    name: soc-vm-watchdog
    user: andrei
    minute: "*/5"
    job: /home/andrei/soc-watchdog/soc-vm-watchdog.sh

# Retire the single-VM predecessor. Its log at /home/andrei/suricata/watchdog.log is left in
# place for history; only the script and its cron entry go.
- name: Remove superseded suricata-watchdog cron entry
  ansible.builtin.cron:
    name: suricata-watchdog
    user: andrei
    state: absent

- name: Remove superseded suricata-watchdog script
  ansible.builtin.file:
    path: /home/andrei/suricata/suricata-watchdog.sh
    state: absent

# ---------- NUT / UPS power-loss chain ----------
# Codified 2026-08-23. This chain was previously NOT Ansible-managed, which is exactly how
# the ups-loki collector was silently lost in the 2026-07-02 reinstall — and it is the
# power-loss safety path, so losing it is worse than losing a dashboard.
#
# The 2026-08-23 11:11 outage ran the host on battery for 47 min, then cut power hard
# because ups-resilience was still in DRY-RUN. It is now ARMED, which makes these files
# load-bearing.
#
# ⚠ /etc/nut/ARMED is DELIBERATELY NOT MANAGED — it is the operator's arm/disarm toggle.
# ⚠ upsd.users and upsmon.conf carry the monuser password, so they are TEMPLATES fed from
#   vault_nut_monuser_password. The sanitised copies under scripts/ups-monitoring/ still say
#   "CHANGEME"; copying those verbatim would break UPS monitoring outright.
# ⚠ NO handler restarts nut-server/nut-monitor. A restart drops UPS monitoring for a moment,
#   and is not worth automating for a comment-only change. After a FUNCTIONAL edit here run:
#       sudo systemctl restart nut-server nut-monitor
- name: Install NUT config files (no secrets)
  ansible.builtin.copy:
    src: "nut-{{ item }}"
    dest: "/etc/nut/{{ item }}"
    owner: root
    group: nut
    mode: "0640"
  loop:
    - nut.conf
    - ups.conf
    - upsd.conf
    - upssched.conf

- name: Install NUT upssched-cmd.sh
  ansible.builtin.copy:
    src: nut-upssched-cmd.sh
    dest: /etc/nut/upssched-cmd.sh
    owner: root
    group: nut
    mode: "0750"

- name: Install NUT credential files from vault
  ansible.builtin.template:
    src: "nut-{{ item }}.j2"
    dest: "/etc/nut/{{ item }}"
    owner: root
    group: nut
    mode: "0640"
  loop:
    - upsd.users
    - upsmon.conf
  no_log: true

- name: Install sudoers rule letting the nut user start ups-resilience
  ansible.builtin.copy:
    src: nut-shutdown.sudoers
    dest: /etc/sudoers.d/nut-shutdown
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"

- name: Install ups-resilience script
  ansible.builtin.copy:
    src: ups-resilience.sh
    dest: /usr/local/bin/ups-resilience.sh
    owner: root
    group: root
    mode: "0755"

- name: Install ups-resilience unit
  ansible.builtin.copy:
    src: ups-resilience.service
    dest: /etc/systemd/system/ups-resilience.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Ensure NUT services are enabled and running
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - nut-server
    - nut-monitor
  when: not ansible_check_mode

# ---------- PXE / UEFI netboot server (on-demand; assets fetched manually) ----------
# 2026-07-07: on-demand, Secure-Boot-capable UEFI netboot server (Clonezilla +
# Ubuntu Server + Fedora). Every unit is DISABLED by default and toggled only via
# `pxe-clone start|stop` — off = zero footprint. This role provisions the FRAMEWORK
# (packages, masked stock dnsmasq, dirs, config, units, grub menu); the boot ASSETS
# (ISOs, filesystem.squashfs, signed shims/grubs, kernels) are large and fetched by
# hand — see scripts/netboot-15/README.md and docs/superpowers/plans/2026-07-06-
# pxe-netboot-server.md. dnsmasq runs proxyDHCP-only (port=0, never assigns IPs —
# .1 stays the DHCP authority). Validated end-to-end 2026-07-07 via QEMU+OVMF.
- name: Ensure PXE netboot packages present
  ansible.builtin.apt:
    name:
      - dnsmasq
      - nfs-kernel-server
    state: present
    update_cache: true
    cache_valid_time: 3600

# `enabled: false` was paired with `masked: true` here until 2026-08-01. A masked
# unit reports is-enabled=masked, which never satisfies enabled=false, so the task
# reported `changed` on every single run (confirmed via --check --diff against the
# live .15, where dnsmasq was already masked). Masking alone prevents start.
- name: Mask stock dnsmasq (a dedicated pxe-dnsmasq instance is used)
  ansible.builtin.systemd:
    name: dnsmasq
    masked: true

- name: Ensure nfs-server is not enabled at boot (pxe-clone starts it on demand)
  ansible.builtin.systemd:
    name: nfs-server
    enabled: false

- name: Create PXE netboot directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/netboot
    - /srv/tftp/grub
    - /srv/tftp/clonezilla
    - /srv/tftp/ubuntu-server
    - /srv/tftp/fedora44
    - /mnt/backup/clonezilla-images

- name: Deploy PXE dnsmasq config + grub netboot menu
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - { src: dnsmasq-pxe.conf, dest: /etc/netboot/dnsmasq-pxe.conf }
    - { src: grub.cfg, dest: /srv/tftp/grub/grub.cfg }

- name: Deploy PXE systemd units (disabled by default — on-demand only)
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - pxe-dnsmasq.service
    - pxe-http.service
    - pxe-nfs-export.service
    - pxe-netboot.target
  notify: Reload systemd

- name: Deploy pxe-clone toggle
  ansible.builtin.copy:
    src: pxe-clone
    dest: /usr/local/sbin/pxe-clone
    owner: root
    group: root
    mode: "0755"

# ---------- VM disk TRIM (discard + nonrotational) ----------
# 2026-08-20: audit found discard=off AND nonrotational=off on every substantial
# VM (Suricata, ELK, T-Pot Hive, T-Pot Sensor, OpenCTi — only OpenCanary was
# correct). With discard off a guest's deletes never release blocks: the VDI only
# grows and the SSD FTL treats the entire ever-written footprint as live data, so
# garbage collection and erase counts inflate. That is the leading explanation for
# the SU800 pair dropping 100%->95% Remaining_Lifetime_Perc in ~6 weeks on only
# ~0.7 TB of host writes (SM firmware derives that attribute from erase count,
# not TBW). Host-side TRIM was already fine: fstrim.timer weekly, discard
# advertised sdc/sdd -> md127 -> dm_crypt-0 -> vg0-lv--vms, lvm issue_discards=1.
#
# VBoxManage refuses --discard/--nonrotational while the VM is running (the .vbox
# is locked), so this CANNOT converge a running VM. It therefore applies only to
# powered-off VMs and merely REPORTS the rest — never stops a VM behind your back.
# To fix a reported VM: ACPI-shutdown it, re-run, start it again.
# Runs as andrei: VBoxManage under sudo addresses root's own VM registry, which is
# empty (see memory feedback vboxmanage-runs-as-owner).
- name: Query VM storage attributes
  ansible.builtin.command:
    cmd: "VBoxManage showvminfo {{ item.name | quote }} --machinereadable"
  become: true
  become_user: andrei
  loop: "{{ hypervisor_vm_trim }}"
  loop_control:
    label: "{{ item.name }}"
  register: hv_vminfo
  changed_when: false
  failed_when: false
  check_mode: false   # read-only query; must run in --check or the TRIM logic below never evaluates

- name: Enable discard + nonrotational on powered-off VM disks
  ansible.builtin.command:
    cmd: >-
      VBoxManage storageattach {{ item.item.name | quote }}
      --storagectl {{ item.item.controller }} --port 0 --device 0
      --type hdd --medium {{ item.item.medium | quote }}
      --nonrotational on --discard on
  become: true
  become_user: andrei
  loop: "{{ hv_vminfo.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - item.rc == 0
    - '"VMState=\"poweroff\"" in item.stdout'
    - item.stdout is search(item.item.controller ~ '-(discard|nonrotational)-0-0"="off"')

- name: Report running VMs that still need TRIM enabled
  ansible.builtin.debug:
    msg: >-
      {{ item.item.name }} is RUNNING with discard/nonrotational off —
      ACPI-shutdown it and re-run this role, then start it again.
  loop: "{{ hv_vminfo.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - item.rc == 0
    - '"VMState=\"poweroff\"" not in item.stdout'
    - item.stdout is search(item.item.controller ~ '-(discard|nonrotational)-0-0"="off"')
