---
# Mostly a fetch-for-version-control role - T-Pot self-manages its own configs.
# Two deliberate exceptions DO push to the hosts: the Wazuh localfile block and
# the SENSOR logstash iprep override - both documented at their task blocks below.
# Missing source files are tolerated via failed_when: false.

- name: Create local backup directory
  ansible.builtin.file:
    path: "{{ tpot_backup_dir }}/{{ inventory_hostname }}"
    state: directory
    mode: "0750"
  delegate_to: localhost

- name: Fetch .env
  ansible.builtin.fetch:
    src: "{{ tpot_install_path }}/.env"
    dest: "{{ tpot_backup_dir }}/{{ inventory_hostname }}/"
    flat: true
  register: fetch_env
  failed_when: fetch_env.failed and "not found" not in (fetch_env.msg | default(""))

- name: Fetch docker-compose.yml
  ansible.builtin.fetch:
    src: "{{ tpot_install_path }}/docker-compose.yml"
    dest: "{{ tpot_backup_dir }}/{{ inventory_hostname }}/"
    flat: true
  register: fetch_compose
  failed_when: fetch_compose.failed and "not found" not in (fetch_compose.msg | default(""))

- name: Fetch nginx lswebpasswd (HIVE only)
  ansible.builtin.fetch:
    src: "{{ tpot_install_path }}/data/nginx/conf/lswebpasswd"
    dest: "{{ tpot_backup_dir }}/{{ inventory_hostname }}/"
    flat: true
  when: tpot_type == "HIVE"
  register: fetch_lswebpasswd
  failed_when: fetch_lswebpasswd.failed and "not found" not in (fetch_lswebpasswd.msg | default(""))

- name: Fetch nginx cert (HIVE only)
  ansible.builtin.fetch:
    src: "{{ tpot_install_path }}/data/nginx/cert/nginx.crt"
    dest: "{{ tpot_backup_dir }}/{{ inventory_hostname }}/"
    flat: true
  when: tpot_type == "HIVE"
  register: fetch_nginx_cert
  failed_when: fetch_nginx_cert.failed and "not found" not in (fetch_nginx_cert.msg | default(""))

- name: Fetch hive.crt (SENSOR only)
  ansible.builtin.fetch:
    src: "{{ tpot_install_path }}/data/hive.crt"
    dest: "{{ tpot_backup_dir }}/{{ inventory_hostname }}/"
    flat: true
  when: tpot_type == "SENSOR"
  register: fetch_hive_cert
  failed_when: fetch_hive_cert.failed and "not found" not in (fetch_hive_cert.msg | default(""))

- name: Fetch network interface config (SENSOR only)
  ansible.builtin.fetch:
    src: /etc/systemd/network/10-enp0s3.link
    dest: "{{ tpot_backup_dir }}/{{ inventory_hostname }}/"
    flat: true
  when: tpot_type == "SENSOR"
  register: fetch_netconf
  failed_when: fetch_netconf.failed and "not found" not in (fetch_netconf.msg | default(""))

# ============================================================================
# Wazuh agent localfile inputs — JSON honeypot logs (added 2026-06-01).
# Agent install is manual (matches existing convention; see docs/runbooks/
# tpot-rebuild.md Wazuh agent section). Only the localfile block is
# Ansible-managed via blockinfile — matches the Zeek-on-.20 idiom.
# JSON-emitting honeypots only — Heralding (CSV), RDPY/Mailoney/Citrixhoneypot
# (text) deferred until decoders exist.
# ============================================================================

- name: Add T-Pot JSON honeypot inputs to Wazuh agent
  ansible.builtin.blockinfile:
    path: /var/ossec/etc/ossec.conf
    marker: '<!-- {mark} ANSIBLE MANAGED: tpot localfiles -->'
    insertbefore: '</ossec_config>'
    block: |
      <localfile>
        <location>{{ tpot_install_path }}/data/cowrie/log/cowrie.json</location>
        <log_format>json</log_format>
      </localfile>
      <localfile>
        <location>{{ tpot_install_path }}/data/dionaea/log/dionaea.json</location>
        <log_format>json</log_format>
      </localfile>
      <localfile>
        <location>{{ tpot_install_path }}/data/heralding/log/log_session.json</location>
        <log_format>json</log_format>
      </localfile>
      <localfile>
        <location>{{ tpot_install_path }}/data/honeytrap/log/attackers.json</location>
        <log_format>json</log_format>
      </localfile>
      <localfile>
        <location>{{ tpot_install_path }}/data/tanner/log/tanner_report.json</location>
        <log_format>json</log_format>
      </localfile>
      <localfile>
        <location>{{ tpot_install_path }}/data/elasticpot/log/elasticpot.json</location>
        <log_format>json</log_format>
      </localfile>
  notify: Restart wazuh-agent

# ============================================================================
# SENSOR logstash: disable the listbot iprep dictionary (added 2026-08-01).
#
# WHY: http_output.conf loads /etc/listbot/iprep.yaml (~20 MB, ~620k entries)
# into a `translate` filter dictionary. That does not fit the sensor's
# LS_JAVA_OPTS=-Xms512m -Xmx512m, so logstash OOM-killed itself during pipeline
# converge — before processing a single event — in an endless restart loop
# (RestartCount reached 47), pinning a full core on the .15 hypervisor and
# shipping zero honeypot telemetry to the HIVE. The HIVE runs the same file
# fine only because it is provisioned 1024m heap / 2g mem_limit.
#
# http_output.conf lives INSIDE the logstash image, so the fix is a patched
# copy on the host, bind-mounted read-only over the image's path. A T-Pot
# upgrade that rewrites docker-compose.yml drops that mount and the OOM loop
# returns — hence Ansible re-asserts both halves on every run.
#
# The patch is applied to a copy extracted from the CURRENT image on each run,
# never to a file vendored in this repo, so an upstream change to the pipeline
# is picked up instead of being silently overridden by a stale copy.
#
# Permanent alternative if the sensor VM is ever grown to T-Pot's documented
# 8 GB minimum: drop all of this and match the HIVE's 1024m/2g instead.
# ============================================================================

- name: Resolve the sensor logstash image reference
  ansible.builtin.command: docker inspect --format={{ '{{' }}.Config.Image{{ '}}' }} logstash
  register: tpot_logstash_present
  changed_when: false
  failed_when: false
  check_mode: false          # read-only probe; must run in --check or the block below misfires
  when: tpot_type == "SENSOR"

- name: Manage the sensor logstash iprep override
  when:
    - tpot_type == "SENSOR"
    - tpot_logstash_present.rc | default(1) == 0
  block:

    - name: Ensure the logstash override directory exists
      ansible.builtin.file:
        path: "{{ tpot_install_path }}/etc/logstash"
        state: directory
        owner: "{{ tpot_owner }}"
        group: "{{ tpot_owner }}"
        mode: "0755"

    # The next three tasks only ever touch a scratch file under /tmp, so they run
    # even under --check — otherwise the diff shown for the real override below
    # would be computed against a file that does not exist.
    # Read from the IMAGE, not the running container: the override below is
    # bind-mounted over /etc/logstash/http_output.conf, so `docker cp` from the
    # container would hand back our own patched copy and the role could never
    # re-derive from upstream. A throwaway container sees the pristine file.
    - name: Extract the pristine http_output.conf from the logstash image
      ansible.builtin.shell:
        cmd: >-
          docker run --rm --entrypoint cat {{ tpot_logstash_present.stdout }}
          /etc/logstash/http_output.conf > {{ tpot_iprep_tmp }}
      changed_when: false
      check_mode: false

    - name: Comment out the iprep translate filter in the extracted copy
      ansible.builtin.replace:
        path: "{{ tpot_iprep_tmp }}"
        regexp: '(?m)^    translate \{\n(?:      [^\n]*\n)*?      dictionary_path => "/etc/listbot/iprep\.yaml"\n    \}$'
        replace: |-
          # DISABLED by Ansible (roles/tpot): the listbot iprep dictionary is ~20 MB /
          # ~620k entries and does not fit this sensor's 512 MB logstash heap. Loading it
          # OOM-killed the pipeline during converge, in an endless restart loop. The HIVE
          # keeps iprep because it runs a 1024m heap. Cost: sensor events lose the
          # ip_rep src_ip reputation field. See roles/tpot/tasks/main.yml for the detail.
          #    translate {
          #      refresh_interval => 86400
          #      source => "src_ip"
          #      target => "ip_rep"
          #      dictionary_path => "/etc/listbot/iprep.yaml"
          #    }
      changed_when: false
      check_mode: false

    - name: Fail if the iprep filter was not found where expected
      ansible.builtin.lineinfile:
        path: "{{ tpot_iprep_tmp }}"
        line: '      dictionary_path => "/etc/listbot/iprep.yaml"'
        state: absent
      check_mode: true
      register: tpot_iprep_leftover
      failed_when: tpot_iprep_leftover.found | default(0) > 0
      changed_when: false

    - name: Install the patched http_output.conf override
      ansible.builtin.copy:
        src: "{{ tpot_iprep_tmp }}"
        dest: "{{ tpot_install_path }}/etc/logstash/http_output.conf"
        remote_src: true
        owner: "{{ tpot_owner }}"
        group: "{{ tpot_owner }}"
        mode: "0644"
      notify: Restart tpot

    - name: Remove the extracted copy
      ansible.builtin.file:
        path: "{{ tpot_iprep_tmp }}"
        state: absent
      changed_when: false
      check_mode: false

    - name: Bind-mount the override into the logstash service
      ansible.builtin.replace:
        path: "{{ tpot_install_path }}/docker-compose.yml"
        regexp: '(?s)(\n  logstash:(?:(?!\n  \w).)*?\n    volumes:\n     - \$\{TPOT_DATA_PATH\}:/data\n)(?!     - \./etc/logstash/http_output\.conf)'
        replace: '\1     - ./etc/logstash/http_output.conf:/etc/logstash/http_output.conf:ro\n'
        backup: true
      notify: Restart tpot
