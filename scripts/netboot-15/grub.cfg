set timeout=30
set default=0
set gfxpayload=text

menuentry "Clonezilla Live — disk imaging (.15)" {
    echo "Loading Clonezilla..."
    linux (tftp)/clonezilla/vmlinuz boot=live components noswap noprompt nomodeset edd=on \
      username=user config keyboard-layouts=us locales=en_US.UTF-8 ip=dhcp \
      fetch=http://192.168.1.15:8088/clonezilla/filesystem.squashfs \
      ocs_live_run="ocs-live-general" ocs_live_extra_param="" ocs_daemonon="ssh"
    initrd (tftp)/clonezilla/initrd.img
}

menuentry "Ubuntu Server 24.04 — installer (.15)" {
    echo "Chainloading Ubuntu shim..."
    chainloader (tftp)/ubuntu-server/shimx64.efi
}

menuentry "Fedora 44 — netinstall (.15)" {
    echo "Chainloading Fedora shim..."
    chainloader (tftp)/fedora44/shimx64.efi
}

menuentry "Local disk (boot normally)" {
    exit
}
