# Drop-in for vboxautostart-service.service — install at
# /etc/systemd/system/vboxautostart-service.service.d/10-warmup.conf
#
# See vboxautostart-warmup.sh for the full story. Short version: VBoxSVC caches machine
# accessibility once at startup, and two archived VMs (OpenClaw, T-Pot Sensor) live on
# /mnt/cold — a LUKS volume that unlocks late in boot. If VBoxSVC starts first, those two
# are permanently inaccessible to it, VBoxAutostart's enumeration of ALL machines dies with
# E_ACCESSDENIED, and it starts nothing while still exiting 0.
#
# RequiresMountsFor is the actual fix; the ExecStartPre is belt-and-braces for the case
# where a mount unit reports done before the path is really usable.
[Unit]
RequiresMountsFor=/mnt/vms /mnt/cold

[Service]
ExecStartPre=/usr/local/bin/vboxautostart-warmup.sh
