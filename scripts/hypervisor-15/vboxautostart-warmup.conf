# Drop-in for vboxautostart-service.service — install at
# /etc/systemd/system/vboxautostart-service.service.d/10-warmup.conf
#
# VBoxAutostart races its own VBoxSVC spawn at cold boot and silently starts nothing
# (exits 0 after "Enumerating virtual machines failed with E_ACCESSDENIED"). The
# ExecStartPre waits for vboxdrv and then warms VBoxSVC so ExecStart finds it ready.
# Full reasoning in vboxautostart-warmup.sh.
[Service]
ExecStartPre=/usr/local/bin/vboxautostart-warmup.sh
