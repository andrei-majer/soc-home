network:
  version: 2
  renderer: networkd
  ethernets:
    eno1:
      dhcp4: no
      addresses: [192.168.1.15/24]
      routes:
        - to: default
          via: 192.168.1.1
      nameservers:
        addresses: [192.168.1.1]
    enp4s0:
      dhcp4: no
      dhcp6: no
      optional: true
      link-local: []
      accept-ra: false
